<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Polymex — Plant cockpit</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4/dist/index.global.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<style>
  :root { --navy:#172B4D; --navy-2:#2D4A7A; --navy-3:#8FA3C4; --accent:#E8710A; --ok:#1F7A4D; --ink:#1E2530; --muted:#5E6C84; --line:#DFE3EA; --bg:#F4F5F7; }
  body { background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div id="root">
  <div style="padding:48px;text-align:center;color:#5E6C84">Loading the cockpit…</div>
</div>

<!--
  KPI library: plain JavaScript (no JSX) so that node can test it
  (see tests/kpi.test.js, which extracts this block). Every aggregate is a ratio of
  sums, never an average of ratios.
-->
<script id="kpi-lib">
(function (root) {
  var STAGES = ["mixing", "extrusion", "packing"];
  // Above this tonnage, a 2.3 t/h line over 8 h (≈ 18 t max) must have been logged in kg.
  var KG_THRESHOLD_T = 100;

  function safeDiv(a, b) { return b > 0 ? a / b : null; }

  function parseCSV(text) {
    var lines = text.replace(/\r/g, "").split("\n").filter(function (l) { return l.trim() !== ""; });
    if (!lines.length) return [];
    var head = lines[0].split(",").map(function (h) { return h.trim(); });
    return lines.slice(1).map(function (l) {
      var cells = l.split(","), row = {};
      head.forEach(function (h, i) {
        var v = (cells[i] || "").trim();
        row[h] = v !== "" && !isNaN(Number(v)) && h !== "date" ? Number(v) : v;
      });
      return row;
    });
  }

  // Cleans the extrusion log. Returns the clean rows and the list of corrections applied.
  function cleanShiftLog(rows) {
    var seen = {}, out = [], dups = [], kg = [], zero = [], overStop = [];
    rows.forEach(function (r) {
      var key = JSON.stringify(r);
      if (seen[key]) { dups.push(r); return; }
      seen[key] = true;
      var c = Object.assign({}, r);
      if (c.output_t > KG_THRESHOLD_T) {
        kg.push({ date: c.date, shift: c.shift, machine: c.machine, raw: c.output_t });
        c.output_t = c.output_t / 1000; c.scrap_t = c.scrap_t / 1000;
      }
      if (c.planned_min === 0) zero.push(c);
      var stops = c.changeover_min + c.unplanned_downtime_min + c.other_stop_min;
      if (stops > c.planned_min) overStop.push({ date: c.date, shift: c.shift, machine: c.machine, stops: stops, planned: c.planned_min });
      out.push(c);
    });
    return { rows: out, duplicates: dups, kgRows: kg, zeroPlanned: zero, overStop: overStop };
  }

  // Date × shift combinations missing from the log.
  function missingShifts(rows) {
    var have = {}, dates = {};
    rows.forEach(function (r) { have[r.date + "|" + r.shift] = true; dates[r.date] = true; });
    var out = [];
    Object.keys(dates).sort().forEach(function (d) {
      ["A", "B", "C"].forEach(function (s) { if (!have[d + "|" + s]) out.push({ date: d, shift: s }); });
    });
    return out;
  }

  // OEE = availability × performance × quality, each term aggregated as sums.
  function oee(rows) {
    var t = { planned: 0, run: 0, output: 0, scrap: 0, ideal: 0, down: 0, other: 0, co: 0, coMin: 0, n: rows.length };
    rows.forEach(function (r) {
      t.planned += r.planned_min; t.run += r.run_min; t.output += r.output_t; t.scrap += r.scrap_t;
      t.ideal += r.run_min / 60 * r.ideal_rate_tph;
      t.down += r.unplanned_downtime_min; t.other += r.other_stop_min;
      t.co += r.changeovers; t.coMin += r.changeover_min;
    });
    var a = safeDiv(t.run, t.planned), p = safeDiv(t.output, t.ideal);
    var q = t.output > 0 ? 1 - t.scrap / t.output : null;
    return Object.assign(t, {
      availability: a, performance: p, quality: q,
      oee: a === null || p === null || q === null ? null : a * p * q,
      good: t.output - t.scrap, scrapRate: safeDiv(t.scrap, t.output),
      coShare: safeDiv(t.coMin, t.planned)
    });
  }

  function groupBy(rows, fn) {
    var m = {};
    rows.forEach(function (r) { var k = fn(r); (m[k] = m[k] || []).push(r); });
    return m;
  }

  // Monday of the (ISO) week of a YYYY-MM-DD date.
  function weekStart(iso) {
    var d = new Date(iso + "T00:00:00Z"), day = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - day);
    return d.toISOString().slice(0, 10);
  }

  // Starved / blocked rates per stage (share of the stage's planned_min) and bottleneck detection.
  function flow(stageRows) {
    var by = groupBy(stageRows, function (r) { return r.stage; });
    var stages = STAGES.map(function (s) {
      var rows = by[s] || [], P = 0, st = 0, bl = 0, out = 0;
      rows.forEach(function (r) { P += r.planned_min; st += r.starved_min; bl += r.blocked_min; out += r.output_t; });
      return { stage: s, planned: P, starved: st, blocked: bl, output: out,
        starvedPct: safeDiv(st, P), blockedPct: safeDiv(bl, P), idlePct: safeDiv(st + bl, P) };
    });
    // The bottleneck is the stage that waits least (neither starved nor blocked): upstream blocks on it, downstream starves.
    var bottleneck = stages.reduce(function (best, s) {
      return s.idlePct !== null && (best === null || s.idlePct < best.idlePct) ? s : best;
    }, null);
    return { stages: stages, bottleneck: bottleneck ? bottleneck.stage : null };
  }

  // Economic impact of the four problems, over the period then annualised.
  // p: { margin €/t, downtimeCost €/h, smedPct, worstDownPct, bottleneckPct, scrapTarget (fractions 0-1) }.
  // A minute lost in extrusion is worth the actual rate of good tonnes per run hour
  // (= nameplate rate × performance × quality), of the line or of the plant.
  function impacts(rows, stageRows, p) {
    var plant = oee(rows);
    var days = Object.keys(groupBy(rows, function (r) { return r.date; })).length;
    var annual = safeDiv(365, days) || 0;
    var goodRate = function (o) { return safeDiv(o.good, o.run / 60) || 0; };
    var rate = goodRate(plant);
    var tOf = function (min, r) { return min / 60 * r; };

    var lines = Object.keys(groupBy(rows, function (r) { return r.machine; })).sort().map(function (m) {
      var o = oee(rows.filter(function (r) { return r.machine === m; }));
      o.machine = m; o.rate = goodRate(o); return o;
    });
    var worst = lines.reduce(function (a, b) { return b.down > a.down ? b : a; }, lines[0] || null);
    var others = lines.filter(function (l) { return l !== worst; });
    var othersAvgDown = safeDiv(others.reduce(function (s, l) { return s + l.down; }, 0), others.length) || 0;

    // 1. Breakdowns: all lines; lever = targeted maintenance on the worst line.
    var downT = tOf(plant.down, rate);
    var wRate = worst && worst.rate > 0 ? worst.rate : rate;
    var downGainMin = worst ? worst.down * p.worstDownPct : 0;
    var downGainT = tOf(downGainMin, wRate);
    var down = { id: "downtime", minutes: plant.down, tonnes: downT,
      cost: downT * p.margin + plant.down / 60 * p.downtimeCost,
      worst: worst, othersAvgDown: othersAvgDown, alignPct: worst && worst.down > 0 ? Math.max(0, 1 - othersAvgDown / worst.down) : 0,
      gainMin: downGainMin, gainT: downGainT * annual,
      gainEur: (downGainT * p.margin + downGainMin / 60 * p.downtimeCost) * annual };

    // 2. Changeovers: SMED lever (shorter changeover time).
    var coT = tOf(plant.coMin, rate);
    var co = { id: "changeover", minutes: plant.coMin, count: plant.co, tonnes: coT, cost: coT * p.margin,
      avgMin: safeDiv(plant.coMin, plant.co),
      gainMin: plant.coMin * p.smedPct, gainT: coT * p.smedPct * annual, gainEur: coT * p.smedPct * p.margin * annual };

    // 3. Scrap: quality plan lever (bring the scrap rate down to target).
    var scrapRate = plant.scrapRate || 0;
    var scrapGainT = Math.max(0, plant.output * (scrapRate - p.scrapTarget));
    var scrap = { id: "scrap", tonnes: plant.scrap, rate: scrapRate, output: plant.output, cost: plant.scrap * p.margin,
      gainT: scrapGainT * annual, gainEur: scrapGainT * p.margin * annual };

    // 4. Bottleneck: upstream capacity blocked by the bottleneck, valued at the upstream stage's rate.
    var f = flow(stageRows), idx = STAGES.indexOf(f.bottleneck);
    var src = idx > 0 ? f.stages[idx - 1] : f.stages[idx + 1];
    var lostMin = src ? (idx > 0 ? src.blocked : src.starved) : 0;
    var srcRun = src ? src.planned - src.starved - src.blocked : 0;
    var srcRate = src ? safeDiv(src.output, srcRun) || 0 : 0; // t per running unit-minute
    var bnT = lostMin * srcRate;
    var bn = { id: "bottleneck", stage: f.bottleneck, source: src ? src.stage : null, sourceKind: idx > 0 ? "blocked" : "starved",
      minutes: lostMin, ratePerUnitHour: srcRate * 60, tonnes: bnT, cost: bnT * p.margin,
      gainT: bnT * p.bottleneckPct * annual, gainEur: bnT * p.bottleneckPct * p.margin * annual };

    var problems = [bn, down, co, scrap].sort(function (a, b) { return b.cost - a.cost; });
    return { days: days, annual: annual, rate: rate, plant: plant, problems: problems,
      // The bottleneck overlaps breakdowns and changeovers (they are what limits extrusion): not added to the total.
      internalGainEur: down.gainEur + co.gainEur + scrap.gainEur,
      internalGainT: down.gainT + co.gainT + scrap.gainT };
  }

  // Findings for the "Plant questions" tab: scrap and changeovers by line, shift and month.
  function diagnostics(rows) {
    var seg = function (keyFn) {
      var g = groupBy(rows, keyFn);
      return Object.keys(g).sort().map(function (k) {
        var o = oee(g[k]);
        return { key: k, scrapRate: o.scrapRate, co: o.co, coMin: o.coMin, minPerCo: safeDiv(o.coMin, o.co),
          days: Object.keys(groupBy(g[k], function (r) { return r.date; })).length };
      });
    };
    var range = function (list, f) {
      var v = list.map(f).filter(function (x) { return x !== null; });
      return v.length ? { min: Math.min.apply(null, v), max: Math.max.apply(null, v) } : { min: null, max: null };
    };
    var median = function (v) {
      var s = v.filter(function (x) { return x !== null; }).sort(function (a, b) { return a - b; }), n = s.length;
      return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null;
    };
    var machines = seg(function (r) { return r.machine; });
    var shifts = seg(function (r) { return r.shift; });
    var months = seg(function (r) { return r.date.slice(0, 7); });
    // Outlier line: the furthest from the median, if the gap exceeds 0.5 scrap points.
    var med = median(machines.map(function (m) { return m.scrapRate; }));
    var outlier = machines.reduce(function (a, m) {
      return m.scrapRate !== null && med !== null && Math.abs(m.scrapRate - med) > 0.005 &&
        (!a || Math.abs(m.scrapRate - med) > Math.abs(a.scrapRate - med)) ? m : a;
    }, null);
    var rest = machines.filter(function (m) { return m !== outlier; });
    var withCo = oee(rows.filter(function (r) { return r.changeovers > 0; }));
    var withoutCo = oee(rows.filter(function (r) { return r.changeovers === 0; }));
    return {
      plant: oee(rows), machines: machines, shifts: shifts, months: months,
      scrapOutlier: outlier, scrapMedian: med,
      scrapRange: { machines: range(rest, function (m) { return m.scrapRate; }), shifts: range(shifts, function (m) { return m.scrapRate; }),
        months: range(months, function (m) { return m.scrapRate; }) },
      minPerCoRange: { machines: range(machines, function (m) { return m.minPerCo; }), shifts: range(shifts, function (m) { return m.minPerCo; }) },
      scrapWithCo: withCo.scrapRate, scrapWithoutCo: withoutCo.scrapRate,
      coPerDay: months.map(function (m) { return { key: m.key, perDay: safeDiv(m.co, m.days) }; })
    };
  }

  root.PolymexKPI = { safeDiv: safeDiv, parseCSV: parseCSV, cleanShiftLog: cleanShiftLog, missingShifts: missingShifts,
    oee: oee, groupBy: groupBy, weekStart: weekStart, flow: flow, impacts: impacts, diagnostics: diagnostics, STAGES: STAGES };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const K = window.PolymexKPI;

const C = { navy: "#172B4D", navy2: "#2D4A7A", navy3: "#8FA3C4", accent: "#E8710A", ok: "#1F7A4D", muted: "#5E6C84", grid: "#E6E9EF" };
const STAGE_NAME = { mixing: "Mixing", extrusion: "Extrusion", packing: "Packing" };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const nf1 = new Intl.NumberFormat("en-GB", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("en-GB", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (v === null || v === undefined ? "—" : nf1.format(v * 100) + "%");
const tons = (v) => (v === null || v === undefined ? "—" : nf1.format(v) + " t");
const mins = (v) => (v === null || v === undefined ? "—" : nf0.format(v) + " min");
const hours = (m) => nf0.format(m / 60) + " h";
const dShort = (iso) => { const [, m, d] = iso.split("-"); return `${Number(d)} ${MONTHS[Number(m) - 1]}`; };
const dLong = (iso) => { const [y, m, d] = iso.split("-"); return `${Number(d)} ${MONTHS[Number(m) - 1]} ${y}`; };
// Numeric input: commas are thousands separators in English.
const parseNum = (raw) => Number(String(raw).replace(/[\s,]/g, ""));

// ---------- Model ----------
function buildModel(shiftRaw, stageRaw) {
  const clean = K.cleanShiftLog(shiftRaw);
  const rows = clean.rows;
  const dates = [...new Set(rows.map((r) => r.date))].sort();
  const plant = K.oee(rows);

  const machines = Object.entries(K.groupBy(rows, (r) => r.machine))
    .map(([m, rs]) => ({ machine: m, ...K.oee(rs), rows: rs }))
    .sort((a, b) => a.machine.localeCompare(b.machine));

  const shifts = ["A", "B", "C"].map((s) => ({ shift: s, ...K.oee(rows.filter((r) => r.shift === s)) }));

  const weekly = (rs) => Object.entries(K.groupBy(rs, (r) => K.weekStart(r.date)))
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([w, wr]) => ({ week: w, days: new Set(wr.map((r) => r.date)).size, ...K.oee(wr) }));

  const stageClean = stageRaw;
  const flow = K.flow(stageClean);
  const stageWeekly = Object.entries(K.groupBy(stageClean, (r) => K.weekStart(r.date)))
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([w, wr]) => {
      const f = K.flow(wr);
      const o = { week: w };
      f.stages.forEach((s) => { o[s.stage] = s; });
      return o;
    });

  return {
    clean, rows, dates, plant, machines, shifts, stageRows: stageClean,
    idealPlannedT: rows.reduce((s, r) => s + r.planned_min / 60 * r.ideal_rate_tph, 0),
    weeks: weekly(rows), weeklyOf: (m) => weekly(rows.filter((r) => r.machine === m)),
    missing: K.missingShifts(rows), flow, stageWeekly,
    stageOutput: Object.fromEntries(flow.stages.map((s) => [s.stage, s.output])),
  };
}

// ---------- SVG charts ----------
function useHover() { const [h, setH] = useState(null); return [h, setH]; }

// "Round" axis maximum (4 ticks with a step of 1, 2, 2.5 or 5 × 10^n).
function niceMax(v) {
  if (!(v > 0)) return 1;
  const raw = v / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((k) => k >= raw);
  return step * 4;
}

// Vertical bars over a time category.
function Bars({ data, value, label, fmt, height = 200, width = 720, color = C.navy, highlight, yMax, refLine }) {
  const [h, setH] = useHover();
  const W = width, H = height, pl = 52, pr = 12, pt = 16, pb = 30;
  const max = yMax || niceMax(Math.max(...data.map(value).filter((v) => v !== null), 0));
  const bw = (W - pl - pr) / data.length;
  const y = (v) => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => t * max);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img">
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={pl} x2={W - pr} y1={y(t)} y2={y(t)} stroke={C.grid} />
          <text x={pl - 6} y={y(t) + 4} textAnchor="end" fontSize="11" fill={C.muted}>{fmt.axis(t)}</text>
        </g>
      ))}
      {refLine !== undefined && (
        <g>
          <line x1={pl} x2={W - pr} y1={y(refLine.v)} y2={y(refLine.v)} stroke={C.muted} strokeDasharray="4 3" />
          <text x={W - pr} y={y(refLine.v) - 4} textAnchor="end" fontSize="11" fill={C.muted}>{refLine.label}</text>
        </g>
      )}
      {data.map((d, i) => {
        const v = value(d);
        if (v === null) return null;
        const x = pl + i * bw + bw * 0.15, top = y(v);
        const fill = highlight && highlight(d) ? C.accent : color;
        return (
          <g key={i} onMouseEnter={() => setH(i)} onMouseLeave={() => setH(null)}>
            <rect x={pl + i * bw} y={pt} width={bw} height={H - pt - pb} fill="transparent" />
            <rect x={x} y={top} width={bw * 0.7} height={Math.max(0, y(0) - top)} rx="2" fill={fill} opacity={h === null || h === i ? 1 : 0.55} />
            {(i % Math.ceil(data.length / 13) === 0) && (
              <text x={x + bw * 0.35} y={H - 10} textAnchor="middle" fontSize="11" fill={C.muted}>{label(d)}</text>
            )}
          </g>
        );
      })}
      {h !== null && value(data[h]) !== null && (() => {
        const x = Math.min(Math.max(pl + h * bw + bw / 2, pl + 70), W - pr - 70), top = y(value(data[h]));
        return (
          <g pointerEvents="none">
            <rect x={x - 70} y={Math.max(0, top - 30)} width="140" height="22" rx="4" fill={C.navy} />
            <text x={x} y={Math.max(0, top - 30) + 15} textAnchor="middle" fontSize="12" fill="#fff">{label(data[h])} · {fmt.tip(value(data[h]))}</text>
          </g>
        );
      })()}
    </svg>
  );
}

// Multiple lines over a time category.
function Lines({ data, series, label, fmt, height = 220, width = 720, yMax, yMin = 0 }) {
  const [h, setH] = useHover();
  const W = width, H = height, pl = 52, pr = 12, pt = 16, pb = 30;
  const all = data.flatMap((d) => series.map((s) => s.value(d))).filter((v) => v !== null);
  const max = yMax || niceMax(Math.max(...all));
  const step = (W - pl - pr) / Math.max(1, data.length - 1);
  const xs = (i) => pl + i * step;
  const y = (v) => pt + (H - pt - pb) * (1 - (v - yMin) / (max - yMin));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => yMin + t * (max - yMin));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img"
      onMouseLeave={() => setH(null)}
      onMouseMove={(e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const px = ((e.clientX - r.left) / r.width) * W;
        setH(Math.min(data.length - 1, Math.max(0, Math.round((px - pl) / step))));
      }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={pl} x2={W - pr} y1={y(t)} y2={y(t)} stroke={C.grid} />
          <text x={pl - 6} y={y(t) + 4} textAnchor="end" fontSize="11" fill={C.muted}>{fmt.axis(t)}</text>
        </g>
      ))}
      {data.map((d, i) => (i % Math.ceil(data.length / 13) === 0) && (
        <text key={i} x={xs(i)} y={H - 10} textAnchor="middle" fontSize="11" fill={C.muted}>{label(d)}</text>
      ))}
      {series.map((s) => {
        const pts = data.map((d, i) => [xs(i), s.value(d)]).filter(([, v]) => v !== null);
        return (
          <g key={s.name}>
            <polyline fill="none" stroke={s.color} strokeWidth="2.5" strokeLinejoin="round" points={pts.map(([x, v]) => `${x},${y(v)}`).join(" ")} />
            {pts.map(([x, v], i) => <circle key={i} cx={x} cy={y(v)} r="3" fill={s.color} />)}
          </g>
        );
      })}
      {h !== null && (() => {
        const x = xs(h), bx = Math.min(Math.max(x + 8, pl), W - pr - 190);
        return (
          <g pointerEvents="none">
            <line x1={x} x2={x} y1={pt} y2={H - pb} stroke={C.muted} strokeDasharray="3 3" />
            <rect x={bx} y={pt} width="190" height={22 + series.length * 18} rx="4" fill={C.navy} />
            <text x={bx + 10} y={pt + 16} fontSize="12" fill="#fff" fontWeight="600">{label(data[h])}</text>
            {series.map((s, i) => (
              <text key={s.name} x={bx + 10} y={pt + 34 + i * 18} fontSize="12" fill="#fff">
                <tspan fill={s.color === C.navy ? "#9FB3D9" : s.color}>■ </tspan>{s.name}: {fmt.tip(s.value(data[h]))}
              </text>
            ))}
          </g>
        );
      })()}
    </svg>
  );
}

// Simple horizontal bar (ranking, share of a whole).
function HBar({ v, max = 1, color = C.navy, h = 10 }) {
  const w = v === null ? 0 : Math.max(0, Math.min(1, v / max)) * 100;
  return (
    <div className="w-full rounded-sm" style={{ background: C.grid, height: h }}>
      <div className="rounded-sm" style={{ width: `${w}%`, background: color, height: h }} />
    </div>
  );
}

function Legend({ items }) {
  return (
    <div className="flex flex-wrap gap-4 text-sm" style={{ color: C.muted }}>
      {items.map((i) => (
        <span key={i.name} className="flex items-center gap-1.5">

// ---------- Layout ----------
function Card({ title, sub, children, className = "" }) {
  return (
    <section className={`card p-5 ${className}`}>
      {title && <h2 className="text-lg font-semibold" style={{ color: C.navy }}>{title}</h2>}
      {sub && <p className="text-sm mt-0.5 mb-3" style={{ color: C.muted }}>{sub}</p>}
      {!sub && title && <div className="mb-3" />}
      {children}

}

function Kpi({ label, value, note, alert }) {
  return (
    <div className="card p-5" style={alert ? { borderTop: `4px solid ${C.accent}` } : { borderTop: `4px solid ${C.navy}` }}>
      <div className="text-sm font-medium uppercase tracking-wide" style={{ color: C.muted }}>{label}</div>
      <div className="num text-4xl font-semibold mt-2" style={{ color: C.navy }}>{value}</div>
      {note && <div className="text-sm mt-1" style={{ color: C.muted }}>{note}</div>}

}

const fmtPct = { axis: (v) => nf0.format(v * 100) + "%", tip: pct };
const fmtT = { axis: (v) => nf0.format(v) + " t", tip: tons };

// ---------- Tab 1: overview ----------

// ---------- Tab 3: flow ----------
function Flow({ M, E }) {
  const { stages, bottleneck } = M.flow;
  const ext = stages.find((s) => s.stage === "extrusion");
  const mix = stages.find((s) => s.stage === "mixing");
  const pack = stages.find((s) => s.stage === "packing");
  const maxPct = Math.max(...stages.flatMap((s) => [s.starvedPct, s.blockedPct]));
  return (
    <div className="space-y-5">
      <Card title="Flow: mixing → extrusion → packing" sub="Waiting unit-minutes as a share of each stage's planned time (7 units per stage)">
        <div className="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr_auto_1fr] gap-3 items-stretch">
          {stages.map((s, i) => {
            const isB = s.stage === bottleneck;
            return (
              <React.Fragment key={s.stage}>
                <div className="rounded-lg p-5" style={{ border: `2px solid ${isB ? C.accent : C.grid}`, background: isB ? "#FFF6EE" : "#fff" }}>
                  <div className="flex justify-between items-center">
                    <span className="text-xl font-semibold" style={{ color: C.navy }}>{STAGE_NAME[s.stage]}</span>
                    {isB && <span className="text-xs font-bold uppercase px-2 py-1 rounded" style={{ background: C.accent, color: "#fff" }}>Bottleneck</span>}
                  </div>
                  <div className="num text-sm mt-1" style={{ color: C.muted }}>{tons(s.output)} produced</div>
                  <div className="mt-4 space-y-3">
                    <div>
                      <div className="flex justify-between text-sm"><span>Starved (waiting for upstream)</span><span className="num font-semibold">{pct(s.starvedPct)}</span></div>
                      <HBar v={s.starvedPct} max={maxPct} color={C.navy3} />
                    </div>
                    <div>
                      <div className="flex justify-between text-sm"><span>Blocked (downstream full)</span><span className="num font-semibold">{pct(s.blockedPct)}</span></div>
                      <HBar v={s.blockedPct} max={maxPct} color={C.navy} />
                    </div>
                  </div>
                </div>
                {i < stages.length - 1 && <div className="hidden md:flex items-center text-3xl" style={{ color: C.navy3 }}>→</div>}
              </React.Fragment>
            );
          })}
        </div>
        <div className="mt-5 p-4 rounded" style={{ background: "#F4F5F7", borderLeft: `4px solid ${C.accent}` }}>
          <p className="text-base" style={{ color: C.ink }}>
            <b style={{ color: C.navy }}>The bottleneck is {STAGE_NAME[bottleneck].toLowerCase()}.</b>{" "}
            Mixing is blocked {pct(mix.blockedPct)} of the time because extrusion cannot absorb its output,
            and packing waits for extrusion {pct(pack.starvedPct)} of the time. Extrusion itself is almost never
            stopped by the flow ({pct(ext.idlePct)}): it sets the pace of the plant.
            Each OEE point gained in extrusion (currently {pct(M.plant.oee)}) is worth ≈ {tons(M.idealPlannedT * 0.01 * E.impacts.annual)} of good output per year,
            i.e. <b style={{ color: C.navy }}>{eur(M.idealPlannedT * 0.01 * E.impacts.annual * E.values.margin)}/yr</b> of margin.
          </p>
        </div>
      </Card>

      <Card title="Weekly waiting time" sub="Bottleneck signals: mixing blocked (upstream) and packing starved (downstream)">
        <Legend items={[
          { name: "Mixing blocked", color: C.navy },
          { name: "Packing starved", color: C.accent },
          { name: "Extrusion starved + blocked", color: C.navy3 },
        ]} />
        <Lines data={M.stageWeekly}
          series={[
            { name: "Mixing blocked", value: (d) => d.mixing.blockedPct, color: C.navy },
            { name: "Packing starved", value: (d) => d.packing.starvedPct, color: C.accent },
            { name: "Extrusion waiting", value: (d) => d.extrusion.idlePct, color: C.navy3 },
          ]}
          label={(d) => dShort(d.week)} fmt={fmtPct} width={1000} height={260} />
      </Card>

      <Card title="Tonnage per stage" sub="Flow consistency over the period">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          {stages.map((s) => (
            <div key={s.stage} className="rounded p-3" style={{ background: "#F4F5F7" }}>
              <div className="text-xs uppercase tracking-wide" style={{ color: C.muted }}>{STAGE_NAME[s.stage]}</div>
              <div className="num text-2xl font-semibold" style={{ color: C.navy }}>{tons(s.output)}</div>
            </div>
          ))}
        </div>
        <p className="text-sm mt-3" style={{ color: C.muted }}>
          Extrusion tonnage in the flow data ({tons(ext.output)}) matches the line log after correction ({tons(M.plant.output)}).
        </p>
      </Card>
    </div>
  );
}

// ---------- Economic assumptions ----------
// Percentages are entered in % in the interface and converted to fractions for kpi-lib.
// Default selling price: annual revenue and tonnage from the brief (README).
const BRIEF_REVENUE_EUR = 148e6, BRIEF_TONNES = 86000;
const PARAMS = {
  margin: { label: "Contribution margin", unit: "€/t", def: 300, min: 0, max: 1000, step: 10 },
  downtimeCost: { label: "Direct cost of one hour of unplanned downtime", unit: "€/h", def: 250, min: 0, max: 2000, step: 10,
    hint: "Excluding lost margin: repair work, parts, idle labour." },
  smedPct: { label: "SMED: changeover time reduction", unit: "%", def: 30, min: 0, max: 80, step: 5, pct: true },
  worstDownPct: { label: "Maintenance: breakdown reduction on the worst line", unit: "%", def: 50, min: 0, max: 90, step: 5, pct: true },
  bottleneckPct: { label: "Capacity: share of upstream blocking recovered", unit: "%", def: 50, min: 0, max: 100, step: 5, pct: true },
  scrapTarget: { label: "Target scrap rate", unit: "%", def: 4, min: 0, max: 10, step: 0.5, pct: true },
  price: { label: "Average selling price", unit: "€/t", def: Math.round(BRIEF_REVENUE_EUR / BRIEF_TONNES),
    hint: "Default: €148M revenue / 86,000 t per year (brief)." },
  operators: { label: "Operators per line per shift", unit: "people", def: 2 },
  energyPrice: { label: "Electricity cost", unit: "€/MWh", def: 150 },
  energyKwhT: { label: "Extrusion power consumption", unit: "kWh/t", def: 350 },
};
const HYP_KEYS = ["margin", "downtimeCost", "smedPct", "worstDownPct", "bottleneckPct", "scrapTarget"];
const FIELD_CARDS = [
  { key: "margin", title: "Actual margin per tonne", who: "Management control" },
  { key: "price", title: "Average selling price", who: "Sales director" },
  { key: "downtimeCost", title: "Cost of one breakdown hour", who: "Maintenance manager" },
  { key: "scrapTarget", title: "Target scrap rate", who: "Quality manager" },
  { key: "operators", title: "Extrusion headcount", who: "Production manager" },
  { key: "energyPrice", title: "Electricity price", who: "Purchasing / facilities" },
  { key: "energyKwhT", title: "Consumption per tonne", who: "Process / energy engineering" },
];
const STORE_KEY = "polymex-cockpit-assumptions-v1";

function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (s && typeof s === "object") return { hyp: s.hyp || {}, field: s.field || {} };
  } catch (e) { /* storage unavailable: start from defaults */ }
  return { hyp: {}, field: {} };
}

// Effective value: field data > adjusted assumption > default.
function useAssumptions() {
  const [store, setStore] = useState(loadStore);
  const [resetKey, setResetKey] = useState(0);
  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignored */ } }, [store]);
  const values = {};
  Object.keys(PARAMS).forEach((k) => { values[k] = store.field[k] ?? store.hyp[k] ?? PARAMS[k].def; });
  const lib = {};
  Object.keys(PARAMS).forEach((k) => { lib[k] = PARAMS[k].pct ? values[k] / 100 : values[k]; });
  return {
    values, lib, store, resetKey,
    pending: FIELD_CARDS.filter((c) => store.field[c.key] === undefined).length,
    confirmed: (k) => store.field[k] !== undefined,
    setHyp: (k, v) => setStore((s) => ({ ...s, hyp: { ...s.hyp, [k]: v } })),
    setField: (k, v) => setStore((s) => {
      const field = { ...s.field };
      if (v === undefined) delete field[k]; else field[k] = v;
      return { ...s, field };
    }),
    reset: () => { setStore({ hyp: {}, field: {} }); setResetKey((n) => n + 1); },
  };
}

const eur = (v) => {
  if (v === null || v === undefined || !Number.isFinite(v)) return "—";
  const a = Math.abs(v), sign = v < 0 ? "−" : "";
  if (a >= 1e6) return sign + "€" + nf1.format(a / 1e6) + "M";
  if (a >= 1e4) return sign + "€" + nf0.format(a / 1e3) + "k";
  return sign + "€" + nf0.format(a);
};
const fmtParam = (k, v) => (PARAMS[k].pct ? nf1.format(v) + "%" : nf0.format(v) + " " + PARAMS[k].unit);

function Badge({ ok }) {
  return ok
    ? <span className="text-xs font-semibold px-2 py-0.5 rounded" style={{ background: "#E6F2EC", color: C.ok }}>Field value</span>
    : <span className="text-xs font-semibold px-2 py-0.5 rounded whitespace-nowrap" style={{ background: "#FDEBDD", color: "#9A4A06" }}>to confirm with the plant</span>;
}

function AssumptionsPanel({ A }) {
  return (
    <section className="card p-5 xl:sticky xl:top-4">
      <h2 className="text-lg font-semibold" style={{ color: C.navy }}>Calculation assumptions</h2>
      <p className="text-sm mt-0.5 mb-4" style={{ color: C.muted }}>Every € amount in the cockpit is recalculated on each change.</p>
      <div className="space-y-5">
        {HYP_KEYS.map((k) => {
          const p = PARAMS[k], locked = A.confirmed(k);
          return (
            <div key={k}>
              <div className="flex justify-between items-baseline gap-2">
                <label htmlFor={`hyp-${k}`} className="text-sm font-medium">{p.label}</label>
                <span className="num font-semibold whitespace-nowrap" style={{ color: C.navy }}>{fmtParam(k, A.values[k])}</span>
              </div>
              <input id={`hyp-${k}`} type="range" className="w-full mt-1" style={{ accentColor: C.navy }}
                min={p.min} max={Math.max(p.max, A.values[k])} step={p.step} value={A.values[k]} disabled={locked}
                onChange={(e) => A.setHyp(k, Number(e.target.value))} />
              {locked
                ? <div className="text-xs" style={{ color: C.ok }}>Replaced by the field value entered below.</div>
                : p.hint && <div className="text-xs" style={{ color: C.muted }}>{p.hint}</div>}
            </div>
          );
        })}
      </div>
      <div className="mt-5 pt-4 flex items-center justify-between gap-3" style={{ borderTop: `1px solid ${C.grid}` }}>
        <span className="text-xs" style={{ color: C.muted }}>Values saved in this browser.</span>
        <button className="text-sm font-semibold px-3 py-1.5 rounded border" style={{ color: C.navy, borderColor: C.grid }}
          onClick={() => { if (window.confirm("Reset all assumptions and field values?")) A.reset(); }}>
          Reset values
        </button>
      </div>
    </section>
  );
}

function FieldCard({ card, A }) {
  const p = PARAMS[card.key], saved = A.store.field[card.key];
  const [draft, setDraft] = useState(saved === undefined ? "" : String(saved));
  const [invalid, setInvalid] = useState(false);
  const onChange = (e) => {
    const raw = e.target.value;
    setDraft(raw);
    if (raw.trim() === "") { setInvalid(false); A.setField(card.key, undefined); return; }
    const n = parseNum(raw);
    if (Number.isFinite(n) && n >= 0) { setInvalid(false); A.setField(card.key, n); } else setInvalid(true);
  };
  return (
    <div className="card p-4 flex flex-col gap-2" style={{ borderTop: `3px solid ${saved === undefined ? C.accent : C.ok}` }}>
      <div className="flex justify-between items-start gap-2">
        <span className="font-semibold" style={{ color: C.navy }}>{card.title}</span>
        {saved === undefined ? <Badge ok={false} /> : null}
      </div>
      <div className="text-xs" style={{ color: C.muted }}>Ask: {card.who}</div>
      <div className="flex items-center rounded border" style={{ borderColor: invalid ? C.accent : C.grid }}>
        <input type="text" inputMode="decimal" className="num w-full px-3 py-2 text-lg outline-none rounded" placeholder={nf0.format(p.def)}
          value={draft} onChange={onChange} aria-label={card.title} />
        <span className="px-3 text-sm" style={{ color: C.muted }}>{p.unit}</span>
      </div>
      <div className="text-xs" style={{ color: invalid ? C.accent : C.muted }}>
        {invalid ? "A positive number is expected." : saved === undefined ? `Default value used: ${fmtParam(card.key, p.def)}` : `Used everywhere in the cockpit.`}
      </div>
    </div>
  );
}

// ---------- Tab 4: problems and impact ----------
function ProblemCard({ rank, pb, E, M, maxCost }) {
  const v = E.values, I = E.impacts, rate = nf2.format(I.rate);
  let title, detail, method, lever, leverText, extra = null, note = null;
  if (pb.id === "bottleneck") {
    const srcPct = K.safeDiv(pb.minutes, M.flow.stages.find((s) => s.stage === pb.source)?.planned || 0);
    const src = STAGE_NAME[pb.source], bnName = pb.stage ? STAGE_NAME[pb.stage].toLowerCase() : "the bottleneck";
    title = `Flow bottleneck: ${pb.stage ? STAGE_NAME[pb.stage].toLowerCase() : "not identified"}`;
    detail = pb.sourceKind === "blocked"
      ? `${src || "Upstream"} is blocked ${pct(srcPct)} of its time for lack of room in ${bnName}: upstream capacity is available but not converted.`
      : `${src || "Downstream"} waits ${pct(srcPct)} of its time.`;
    method = `${nf0.format(pb.minutes)} blocked unit-minutes (${(src || "").toLowerCase()}) ÷ 60 × ${nf2.format(pb.ratePerUnitHour)} t/h per running unit = ${tons(pb.tonnes)}`;
    lever = "Capacity at the bottleneck";
    leverText = `Add extrusion capacity (hours, debottlenecking, an 8th line) to absorb ${nf0.format(v.bottleneckPct)}% of upstream blocking. Weigh the gain against the investment cost.`;
    note = "Overlaps breakdowns and changeovers, which themselves limit extrusion: not added to the total.";
  } else if (pb.id === "downtime") {
    const w = pb.worst;
    title = "Breakdowns (unplanned downtime)";
    detail = w ? `${w.machine} accounts for ${mins(w.down)} of breakdowns, ${nf1.format(K.safeDiv(w.down, pb.othersAvgDown) || 0)} times the average of the other lines (${mins(pb.othersAvgDown)}). That is ${nf0.format(pb.minutes / 60 * v.operators)} idle operator-hours across the plant.` : "";
    method = `${nf0.format(pb.minutes)} min ÷ 60 × ${rate} good t/h = ${tons(pb.tonnes)}; cost = t × ${nf0.format(v.margin)} €/t + ${nf0.format(pb.minutes / 60)} h × ${nf0.format(v.downtimeCost)} €/h`;
    lever = `Targeted maintenance on ${w ? w.machine : "the worst line"}`;
    leverText = `Cut breakdowns on ${w ? w.machine : "the worst line"} by ${nf0.format(v.worstDownPct)}% (matching the other lines' average = −${nf0.format(pb.alignPct * 100)}%): root-cause analysis, preventive maintenance, critical spares.`;
    const max = Math.max(...M.machines.map((m) => m.down));
    extra = (
      <div className="grid grid-cols-7 gap-2 mt-3 items-end" style={{ height: 70 }}>
        {M.machines.map((m) => (
          <div key={m.machine} className="flex flex-col items-center justify-end h-full" title={`${m.machine}: ${mins(m.down)}`}>
            <div className="w-full rounded-sm" style={{ height: `${(K.safeDiv(m.down, max) || 0) * 48}px`, background: w && m.machine === w.machine ? C.accent : C.navy3 }} />
            <span className="text-xs mt-1" style={{ color: w && m.machine === w.machine ? C.accent : C.muted, fontWeight: w && m.machine === w.machine ? 700 : 400 }}>{m.machine}</span>
          </div>
        ))}
      </div>
    );
  } else if (pb.id === "changeover") {
    title = "Time lost to changeovers";
    detail = `${nf0.format(pb.count)} changeovers, ${mins(pb.avgMin)} each on average, i.e. ${pct(M.plant.coShare)} of planned time.`;
    method = `${nf0.format(pb.minutes)} min ÷ 60 × ${rate} good t/h = ${tons(pb.tonnes)}`;
    lever = "SMED";
    leverText = `Cut changeover time by ${nf0.format(v.smedPct)}%: off-line preparation, standardised purges, recipe sequencing.`;
  } else {
    const mwh = pb.tonnes * v.energyKwhT / 1000;
    title = "Scrap and rework";
    detail = `${pct(pb.rate)} of gross output. Energy consumed by scrap: ${nf0.format(mwh)} MWh, i.e. ${eur(mwh * v.energyPrice)} over the period.`;
    method = `Σ scrap_t = ${tons(pb.tonnes)} (scrapped + reworked), valued at margin`;
    lever = "Quality plan";
    leverText = `Bring the scrap rate from ${pct(pb.rate)} down to ${nf1.format(v.scrapTarget)}%: start-up settings, raw material checks, follow-up by shift.`;
    if (pb.gainT === 0) note = "The current rate is already below target: no gain under this assumption.";
  }
  return (
    <section className="card p-5">
      <div className="flex items-start justify-between gap-4">
        <div className="flex items-start gap-3 flex-1 min-w-0">
          <span className="num text-lg font-bold rounded w-9 h-9 flex items-center justify-center shrink-0"
            style={{ background: rank === 1 ? C.accent : C.navy, color: "#fff" }}>{rank}</span>
          <div>
            <h3 className="text-lg font-semibold" style={{ color: C.navy }}>{title}</h3>
            <p className="text-sm mt-0.5" style={{ color: C.ink }}>{detail}</p>
          </div>
        </div>
        <div className="text-right shrink-0">
          <div className="num text-3xl font-semibold whitespace-nowrap" style={{ color: C.navy }}>{tons(pb.tonnes)}</div>
          <div className="text-xs" style={{ color: C.muted }}>lost over {I.days} days</div>
        </div>
      </div>
      <div className="mt-3"><HBar v={pb.cost} max={maxCost} color={rank === 1 ? C.accent : C.navy} h={8} /></div>
      <div className="num flex flex-wrap gap-x-6 gap-y-1 mt-2 text-sm">
        <span>Cost over the period: <b>{eur(pb.cost)}</b></span>
        <span>Annualised: <b>{eur(pb.cost * I.annual)}/yr</b></span>
        <span style={{ color: C.muted }}>Revenue not realised: {eur(pb.tonnes * v.price)}</span>
      </div>
      <div className="num text-xs mt-2 px-3 py-2 rounded" style={{ background: "#F4F5F7", color: C.muted, fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace" }}>
        Method: {method}
      </div>
      {extra}
      <div className="mt-4 p-4 rounded flex flex-wrap justify-between gap-4" style={{ border: `1px solid ${C.grid}`, borderLeft: `4px solid ${C.ok}` }}>
        <div className="flex-1 min-w-[240px]">
          <div className="text-xs font-bold uppercase tracking-wide" style={{ color: C.ok }}>Lever: {lever}</div>
          <p className="text-sm mt-1">{leverText}</p>
        </div>
        <div className="text-right">
          <div className="num text-2xl font-semibold" style={{ color: C.ok }}>+{eur(pb.gainEur)}/yr</div>
          <div className="num text-xs" style={{ color: C.muted }}>+{tons(pb.gainT)} good per year</div>
        </div>
      </div>
      {note && <p className="text-xs mt-2" style={{ color: C.muted }}>{note}</p>}
    </section>
  );
}

function Problems({ M, E, A }) {
  const I = E.impacts, maxCost = Math.max(...I.problems.map((p) => p.cost), 0);
  const bn = I.problems.find((p) => p.id === "bottleneck");
  return (
    <div className="space-y-5">
      <div className="grid grid-cols-1 xl:grid-cols-3 gap-5 items-start">
        <div className="xl:col-span-2 space-y-5">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <Kpi label="Gain from 3 internal levers" value={`${eur(I.internalGainEur)}/yr`} note={`+${tons(I.internalGainT)} good per year (SMED, maintenance, quality)`} />
            <Kpi label="Bottleneck capacity ceiling" value={`${eur(bn.gainEur)}/yr`} alert note="Not additive: overlaps breakdowns and changeovers" />
            <Kpi label="Margin used" value={`${nf0.format(E.values.margin)} €/t`}
              note={A.confirmed("margin") ? "Field value" : "Assumption, to confirm with the plant"} />
          </div>
          <p className="text-sm" style={{ color: C.muted }}>
            Problems ranked from most to least costly over the period. Tonnes lost = good tonnes not produced,
            at the actual extrusion rate ({nf2.format(I.rate)} good t per run hour per line). Annualised × 365 / {I.days} days.
            Since extrusion is the bottleneck, every tonne it gains is assumed to be sold: to confirm with the sales director.
          </p>
          {I.problems.map((pb, i) => <ProblemCard key={pb.id} rank={i + 1} pb={pb} E={E} M={M} maxCost={maxCost} />)}
        </div>
        <AssumptionsPanel A={A} />
      </div>

      <Card title="To collect on the shop floor" sub={`Data to ask the plant teams for. ${A.pending} of ${FIELD_CARDS.length} still to confirm; while a box is empty, the default value is used.`}>
        <div key={A.resetKey} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          {FIELD_CARDS.map((c) => <FieldCard key={c.key} card={c} A={A} />)}
        </div>
      </Card>
    </div>
  );
}

// ---------- Tab 5: plant questions ----------
const Q_STORE_KEY = "polymex-cockpit-questions-v1";
const Q_STATUS = [
  { key: "open", label: "To investigate", bg: "#FDEBDD", fg: "#9A4A06" },
  { key: "answered", label: "Answer obtained", bg: "#E9EEF6", fg: C.navy },
  { key: "action", label: "Action decided", bg: "#E6F2EC", fg: C.ok },
];
const Q_CARDS = [
  { id: "capacity", title: "Extrusion capacity vs demand",
    fields: [
      { key: "demand", label: "Monthly demand", unit: "t/month", type: "number" },
      { key: "seasonality", label: "Seasonality", type: "text", placeholder: "Peaks, troughs, months concerned…" },
      { key: "comments", label: "Comments", type: "textarea" },
    ] },
  { id: "changeover", title: "Changeovers",
    fields: [
      { key: "cause", label: "Main cause of the ~100 min", type: "text" },
      { key: "smed", label: "SMED ideas raised", type: "textarea" },
      { key: "comments", label: "Comments", type: "textarea" },
    ] },
  { id: "quality", title: "Quality / scrap",
    fields: [
      { key: "rootCause", label: "Suspected root cause", type: "text" },
      { key: "actions", label: "Planned actions", type: "textarea" },
      { key: "comments", label: "Comments", type: "textarea" },
    ] },
];

function useQuestions() {
  const [store, setStore] = useState(() => {
    try { const s = JSON.parse(localStorage.getItem(Q_STORE_KEY) || "null"); if (s && typeof s === "object") return s; } catch (e) { /* ignored */ }
    return {};
  });
  useEffect(() => { try { localStorage.setItem(Q_STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignored */ } }, [store]);
  const get = (id) => store[id] || { status: "open", fields: {} };
  const update = (id, patch) => setStore((s) => {
    const cur = s[id] || { status: "open", fields: {} };
    return { ...s, [id]: { ...cur, ...patch, fields: { ...cur.fields, ...(patch.fields || {}) }, updatedAt: new Date().toISOString() } };
  });
  return { get, update, open: Q_CARDS.filter((c) => get(c.id).status === "open").length, reset: () => setStore({}) };
}

const pts = (a, b) => nf2.format(Math.abs(a - b) * 100) + " pt";
const pct2 = (v) => (v === null || v === undefined ? "—" : nf2.format(v * 100) + "%");
const rangeTxt = (r, f) => (r.min === null ? "—" : r.min === r.max ? f(r.min) : `${f(r.min)} – ${f(r.max)}`);
const monthName = (key) => MONTHS[Number(key.slice(5, 7)) - 1];

// Quantified findings, recomputed from the data on every load.
function findings(id, M, D, demand) {
  if (id === "capacity") {
    const st = Object.fromEntries(M.flow.stages.map((s) => [s.stage, s]));
    const perMonth = 365 / 12 / M.dates.length;
    const goodMonth = M.plant.good * perMonth, maxMonth = M.idealPlannedT * perMonth;
    const isExt = M.flow.bottleneck === "extrusion";
    const facts = [
      <>Packing is starved <b>{pct(st.packing.starvedPct)}</b> of planned time.</>,
      <>Extrusion is almost never blocked (<b>{pct(st.extrusion.blockedPct)}</b>) or starved ({pct(st.extrusion.starvedPct)}).</>,
      <>Mixing is blocked by downstream <b>{pct(st.mixing.blockedPct)}</b> of the time.</>,
      <>Current good extrusion output: <b>{tons(goodMonth)}/month</b>; theoretical ceiling at 100% OEE: {tons(maxMonth)}/month.</>,
    ];
    const verdict = isExt
      ? "Extrusion is the bottleneck: it sets the pace of the plant. Every extra tonne of demand has to go through it."
      : `The computed bottleneck is ${STAGE_NAME[M.flow.bottleneck] ? STAGE_NAME[M.flow.bottleneck].toLowerCase() : "not identified"}: revisit the capacity question accordingly.`;
    let gap = null;
    if (demand > 0) {
      const d = demand - goodMonth;
      gap = d > 0
        ? <>Demand entered: {tons(demand)}/month, i.e. <b style={{ color: C.accent }}>{tons(d)}/month more</b> than current output ({pct(K.safeDiv(d, goodMonth))}){demand > maxMonth ? ", beyond even the theoretical ceiling: extra capacity is required" : ", achievable by improving OEE"}.</>
        : <>Demand entered: {tons(demand)}/month, covered by current output (headroom of {tons(-d)}/month): the issue is then service, not capacity.</>;
    }
    return { facts, verdict, gap,
      questions: ["What is actual demand (order book, forecasts), so we can size extrusion capacity?",
        "Is demand seasonal? Will the small batches from the two retail clients keep growing?"] };
  }
  if (id === "changeover") {
    const r = D.minPerCoRange, avg = K.safeDiv(D.plant.coMin, D.plant.co) || 0;
    const spread = Math.max(r.machines.max - r.machines.min, r.shifts.max - r.shifts.min);
    const homogeneous = avg > 0 && spread / avg < 0.1;
    const first = D.coPerDay[0], last = D.coPerDay[D.coPerDay.length - 1];
    const fmtMin = (v) => nf0.format(v) + " min";
    return {
      facts: [
        <><b>{nf0.format(D.plant.co)}</b> changeovers over the period, <b>{mins(D.plant.coMin)}</b>, i.e. <b>{pct(D.plant.coShare)}</b> of planned time.</>,
        <>Average duration: <b>{mins(avg)}</b> per changeover; by line {rangeTxt(r.machines, fmtMin)}, by shift {rangeTxt(r.shifts, fmtMin)}.</>,
        first && last && first !== last && <>Frequency: {nf1.format(first.perDay)} changeovers/day in {monthName(first.key)} → <b>{nf1.format(last.perDay)}</b> in {monthName(last.key)}.</>,
      ].filter(Boolean),
      verdict: homogeneous
        ? "Duration is almost identical across all lines and all shifts: this is not an operator skills problem, but a changeover method problem."
        : `A ${fmtMin(spread)} gap between lines or shifts: compare the practices of the best and the worst.`,
      questions: ["Why about " + fmtMin(avg) + " per changeover?", "What are the steps of a changeover (stop, purge, cleaning, restart to spec)?",
        "What is the batch-size policy, and did it change with the retail clients?"] };
  }
  const R = D.scrapRange, o = D.scrapOutlier;
  const spreadOk = (x) => x.min !== null && x.max - x.min < 0.005;
  const uniform = spreadOk(R.machines) && spreadOk(R.shifts) && spreadOk(R.months);
  const coGap = D.scrapWithCo !== null && D.scrapWithoutCo !== null ? D.scrapWithCo - D.scrapWithoutCo : null;
  return {
    facts: [
      <>Overall scrap rate: <b>{pct2(D.plant.scrapRate)}</b> ({tons(D.plant.scrap)}).</>,
      <>By line{o ? ` (excluding ${o.key})` : ""}: {rangeTxt(R.machines, pct2)}; by shift: {rangeTxt(R.shifts, pct2)}; by month: {rangeTxt(R.months, pct2)}.</>,
      o && <>Exception: <b style={{ color: C.accent }}>{o.key} at {pct2(o.scrapRate)}</b>, {pts(o.scrapRate, D.scrapMedian)} above the line median.</>,
      coGap !== null && <>Scrap in shifts with a changeover: <b>{pct2(D.scrapWithCo)}</b>; without: <b>{pct2(D.scrapWithoutCo)}</b>.</>,
    ].filter(Boolean),
    verdict: [
      uniform ? "Scrap is uniform across lines, shifts and months: a systemic cause (material, recipe, standard settings)." : "Scrap varies by line, shift or month: look for the most affected segments.",
      o ? `${o.key} stands out: a machine-specific problem.` : null,
      coGap !== null && Math.abs(coGap) < 0.005 ? "Scrap is not linked to changeovers." : coGap !== null ? `A ${pts(D.scrapWithCo, D.scrapWithoutCo)} gap depending on whether a changeover occurred: to investigate.` : null,
    ].filter(Boolean).join(" "),
    questions: ["Which material, recipe or setting could explain systemic scrap of around " + pct2(D.plant.scrapRate) + "?",
      o ? `What is ${o.key}'s maintenance history?` : "Does any line have a particular maintenance history?"],
  };
}

function QField({ f, value, onChange }) {
  const cls = "w-full px-3 py-2 rounded border outline-none text-base";
  const style = { borderColor: C.grid, background: "#fff" };
  return (
    <label className="block">
      <span className="text-sm font-medium" style={{ color: C.navy }}>{f.label}</span>
      {f.type === "textarea"
        ? <textarea rows={3} className={cls + " mt-1"} style={style} value={value || ""} placeholder={f.placeholder} onChange={(e) => onChange(e.target.value)} />
        : <div className="flex items-center rounded border mt-1" style={{ borderColor: C.grid, background: "#fff" }}>
            <input type="text" inputMode={f.type === "number" ? "decimal" : undefined} className="num w-full px-3 py-2 outline-none rounded text-base"
              value={value || ""} placeholder={f.placeholder} onChange={(e) => onChange(e.target.value)} aria-label={f.label} />
            {f.unit && <span className="px-3 text-sm whitespace-nowrap" style={{ color: C.muted }}>{f.unit}</span>}
          </div>}
    </label>
  );
}

function QuestionCard({ n, card, M, D, Q }) {
  const s = Q.get(card.id), status = Q_STATUS.find((x) => x.key === s.status) || Q_STATUS[0];
  const demand = parseNum(s.fields.demand || "");
  const F = findings(card.id, M, D, Number.isFinite(demand) ? demand : 0);
  return (
    <section className="card p-5" style={{ borderTop: `4px solid ${status.key === "open" ? C.accent : status.key === "action" ? C.ok : C.navy}` }}>
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div className="flex items-start gap-3">
          <span className="num text-lg font-bold rounded w-9 h-9 flex items-center justify-center shrink-0" style={{ background: C.navy, color: "#fff" }}>{n}</span>
          <div>
            <h2 className="text-xl font-semibold" style={{ color: C.navy }}>{card.title}</h2>
            {s.status === "open" && <span className="inline-block mt-1 text-xs font-semibold px-2 py-0.5 rounded" style={{ background: status.bg, color: status.fg }}>To investigate</span>}
          </div>
        </div>
        <div className="flex rounded overflow-hidden border" role="group" aria-label="Status" style={{ borderColor: C.grid }}>
          {Q_STATUS.map((st) => (
            <button key={st.key} onClick={() => Q.update(card.id, { status: st.key })} className="px-3 py-1.5 text-sm font-semibold"
              aria-pressed={s.status === st.key}
              style={s.status === st.key ? { background: st.fg, color: "#fff" } : { background: "#fff", color: C.muted }}>{st.label}</button>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-4">
        <div>
          <div className="text-xs font-bold uppercase tracking-wide mb-2" style={{ color: C.muted }}>Cockpit findings</div>
          <ul className="space-y-1.5 text-sm list-disc pl-5 num">{F.facts.map((f, i) => <li key={i}>{f}</li>)}</ul>
          <p className="text-sm mt-3 p-3 rounded" style={{ background: "#F4F5F7", borderLeft: `4px solid ${C.navy}` }}>{F.verdict}</p>
          <div className="text-xs font-bold uppercase tracking-wide mt-4 mb-2" style={{ color: C.muted }}>Questions to ask</div>
          <ol className="space-y-1 text-base list-decimal pl-5" style={{ color: C.navy }}>{F.questions.map((q, i) => <li key={i}>{q}</li>)}</ol>
        </div>
        <div className="space-y-3">
          <div className="text-xs font-bold uppercase tracking-wide" style={{ color: C.muted }}>Answers from the shop floor</div>
          {card.fields.map((f) => (
            <QField key={f.key} f={f} value={s.fields[f.key]} onChange={(v) => Q.update(card.id, { fields: { [f.key]: v } })} />
          ))}
          {F.gap && <p className="num text-sm p-3 rounded" style={{ background: "#FFF6EE" }}>{F.gap}</p>}
          {s.updatedAt && <div className="text-xs" style={{ color: C.muted }}>Last updated: {new Date(s.updatedAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}</div>}
        </div>
      </div>
    </section>
  );
}

function Questions({ M, Q }) {
  const D = useMemo(() => K.diagnostics(M.rows), [M]);
  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <p className="text-base" style={{ color: C.muted }}>
          Investigation questions for plant visits and conversations with the teams. Findings are recomputed from the CSVs;
          answers are saved in this browser. <b style={{ color: C.navy }}>{Q.open} of {Q_CARDS.length}</b> to investigate.
        </p>
        <button className="text-sm font-semibold px-3 py-1.5 rounded border" style={{ color: C.navy, borderColor: C.grid, background: "#fff" }}
          onClick={() => { if (window.confirm("Clear all answers and set every status back to \"To investigate\"?")) Q.reset(); }}>
          Reset answers
        </button>
      </div>
      {Q_CARDS.map((c, i) => <QuestionCard key={c.id} n={i + 1} card={c} M={M} D={D} Q={Q} />)}
    </div>
  );
}

// ---------- Data notes ----------
function DataNotes({ M }) {
  const c = M.clean;
  const notes = [];
  if (c.duplicates.length) notes.push(`${c.duplicates.length} exact duplicate rows (${[...new Set(c.duplicates.map((r) => dLong(r.date) + ", shift " + r.shift))].join("; ")}): removed.`);
  if (c.kgRows.length) notes.push(`${c.kgRows.length} records logged in kg instead of tonnes (${c.kgRows.map((r) => `${r.machine} ${dShort(r.date)} ${r.shift}: ${nf0.format(r.raw)}`).join("; ")}): divided by 1,000. The total then matches the extrusion tonnage in the flow data.`);
  if (M.missing.length) notes.push(`Shift missing from the log: ${M.missing.map((m) => `${dLong(m.date)}, shift ${m.shift}`).join("; ")}. The daily flow data also shows reduced planned time that day: treated as an unplanned shift, not lost data.`);
  if (c.zeroPlanned.length) notes.push(`${c.zeroPlanned.length} records with 0 planned minutes (${[...new Set(c.zeroPlanned.map((r) => r.machine + " on " + dLong(r.date)))].join("; ")}): line not scheduled, no effect on sums; ratios protected against division by zero.`);
  if (c.overStop.length) notes.push(`Logged stops exceed planned time: ${c.overStop.map((r) => `${r.machine} ${dShort(r.date)} ${r.shift} (${r.stops} min for ${r.planned})`).join("; ")}. run_min = 0 kept as is.`);
  return (
    <Card title="Data notes" sub="Anomalies found in the source files and how they were handled (to confirm with the site)">
      <ul className="list-disc pl-5 space-y-1.5 text-sm">
        {notes.map((n, i) => <li key={i}>{n}</li>)}
        <li>Same nameplate rate for all 7 lines (2.3 t/h): performance compares each line with that same reference.</li>
      </ul>
    </Card>
  );
}

// ---------- Application ----------
const TABS = [["overview", "Overview"], ["lines", "Lines"], ["flow", "Flow"], ["problems", "Problems & impact"], ["questions", "Plant questions"]];

function App() {
  const [state, setState] = useState({ status: "loading" });
  const [tab, setTab] = useState("overview");
  const A = useAssumptions();
  const Q = useQuestions();
  const M0 = state.M;
  const E = useMemo(() => (M0 ? { values: A.values, impacts: K.impacts(M0.rows, M0.stageRows, A.lib) } : null),
    [M0, JSON.stringify(A.lib)]);
  useEffect(() => {
    Promise.all(["./extrusion_shift_log.csv", "./stage_daily.csv"].map((u) =>
      fetch(u).then((r) => { if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`); return r.text(); })))
      .then(([a, b]) => setState({ status: "ok", M: buildModel(K.parseCSV(a), K.parseCSV(b)) }))
      .catch((e) => setState({ status: "error", error: e.message }));
  }, []);

  if (state.status === "loading") return <div className="p-12 text-center" style={{ color: C.muted }}>Loading production data…</div>;
  if (state.status === "error") return (
    <div className="max-w-xl mx-auto mt-16 card p-6">
      <h1 className="text-lg font-semibold" style={{ color: C.accent }}>Could not load the data</h1>
      <p className="mt-2 text-sm">{state.error}</p>
      <p className="mt-2 text-sm" style={{ color: C.muted }}>The CSV files must be served next to index.html (open it through a server, not via file://).</p>
    </div>
  );
  const M = state.M;
  return (
    <div>
      <header style={{ background: C.navy }} className="text-white">
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 className="text-2xl sm:text-3xl font-semibold tracking-tight">Polymex — Plant cockpit</h1>
            <div className="text-sm opacity-80">Period: {dLong(M.dates[0])} – {dLong(M.dates[M.dates.length - 1])} · {M.dates.length} days · 7 extrusion lines · 3 shifts</div>
          </div>
          <nav className="flex flex-wrap items-center gap-1">
            {A.pending > 0 && (
              <button onClick={() => setTab("problems")} className="mr-2 text-xs font-semibold px-2 py-1 rounded"
                style={{ background: "#FDEBDD", color: "#9A4A06" }}>{A.pending} value{A.pending > 1 ? "s" : ""} to confirm with the plant</button>
            )}
            {TABS.map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)} className="px-4 py-2 rounded-t text-base font-semibold"
                style={tab === k ? { background: "#F4F5F7", color: C.navy } : { color: "#fff", opacity: 0.85 }}>
                {l}
                {k === "questions" && Q.open > 0 && (
                  <span className="ml-1.5 text-xs font-bold px-1.5 py-0.5 rounded" style={{ background: C.accent, color: "#fff" }}>{Q.open}</span>
                )}
              </button>
            ))}
          </nav>
        </div>
      </header>
      <main className="max-w-[1400px] mx-auto px-4 sm:px-6 py-6">
        {tab === "overview" && <Overview M={M} E={E} go={setTab} />}
        {tab === "lines" && <Lines_ M={M} E={E} />}
        {tab === "flow" && <Flow M={M} E={E} />}
        {tab === "problems" && <Problems M={M} E={E} A={A} />}
        {tab === "questions" && <Questions M={M} Q={Q} />}
      </main>
      <footer className="max-w-[1400px] mx-auto px-4 sm:px-6 pb-8 text-xs" style={{ color: C.muted }}>
        Indicators computed in the browser from extrusion_shift_log.csv and stage_daily.csv. OEE = availability × performance × quality, aggregated as sums.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
