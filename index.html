<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Polymex — Cockpit usine</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4/dist/index.global.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<style>
  :root { --navy:#172B4D; --navy-2:#2D4A7A; --navy-3:#8FA3C4; --accent:#E8710A; --ok:#1F7A4D; --ink:#1E2530; --muted:#5E6C84; --line:#DFE3EA; --bg:#F4F5F7; }
  body { background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div id="root">
  <div style="padding:48px;text-align:center;color:#5E6C84">Chargement du cockpit…</div>
</div>

<!--
  Bibliothèque KPI : JavaScript pur (pas de JSX) pour pouvoir être testée par node
  (voir tests/kpi.test.js, qui extrait ce bloc). Toutes les agrégations se font par
  sommes, jamais par moyenne de ratios.
-->
<script id="kpi-lib">
(function (root) {
  var STAGES = ["mixing", "extrusion", "packing"];
  // Au-delà de ce tonnage, une ligne de 2,3 t/h sur 8 h (≈ 18 t max) a forcément été saisie en kg.
  var KG_THRESHOLD_T = 100;

  function safeDiv(a, b) { return b > 0 ? a / b : null; }

  function parseCSV(text) {
    var lines = text.replace(/\r/g, "").split("\n").filter(function (l) { return l.trim() !== ""; });
    if (!lines.length) return [];
    var head = lines[0].split(",").map(function (h) { return h.trim(); });
    return lines.slice(1).map(function (l) {
      var cells = l.split(","), row = {};
      head.forEach(function (h, i) {
        var v = (cells[i] || "").trim();
        row[h] = v !== "" && !isNaN(Number(v)) && h !== "date" ? Number(v) : v;
      });
      return row;
    });
  }

  // Nettoyage du journal d'extrusion. Renvoie les lignes propres et la liste des corrections appliquées.
  function cleanShiftLog(rows) {
    var seen = {}, out = [], dups = [], kg = [], zero = [], overStop = [];
    rows.forEach(function (r) {
      var key = JSON.stringify(r);
      if (seen[key]) { dups.push(r); return; }
      seen[key] = true;
      var c = Object.assign({}, r);
      if (c.output_t > KG_THRESHOLD_T) {
        kg.push({ date: c.date, shift: c.shift, machine: c.machine, raw: c.output_t });
        c.output_t = c.output_t / 1000; c.scrap_t = c.scrap_t / 1000;
      }
      if (c.planned_min === 0) zero.push(c);
      var stops = c.changeover_min + c.unplanned_downtime_min + c.other_stop_min;
      if (stops > c.planned_min) overStop.push({ date: c.date, shift: c.shift, machine: c.machine, stops: stops, planned: c.planned_min });
      out.push(c);
    });
    return { rows: out, duplicates: dups, kgRows: kg, zeroPlanned: zero, overStop: overStop };
  }

  // Combinaisons date × shift absentes du journal.
  function missingShifts(rows) {
    var have = {}, dates = {};
    rows.forEach(function (r) { have[r.date + "|" + r.shift] = true; dates[r.date] = true; });
    var out = [];
    Object.keys(dates).sort().forEach(function (d) {
      ["A", "B", "C"].forEach(function (s) { if (!have[d + "|" + s]) out.push({ date: d, shift: s }); });
    });
    return out;
  }

  // TRS = disponibilité × performance × qualité, chaque terme agrégé par sommes.
  function oee(rows) {
    var t = { planned: 0, run: 0, output: 0, scrap: 0, ideal: 0, down: 0, other: 0, co: 0, coMin: 0, n: rows.length };
    rows.forEach(function (r) {
      t.planned += r.planned_min; t.run += r.run_min; t.output += r.output_t; t.scrap += r.scrap_t;
      t.ideal += r.run_min / 60 * r.ideal_rate_tph;
      t.down += r.unplanned_downtime_min; t.other += r.other_stop_min;
      t.co += r.changeovers; t.coMin += r.changeover_min;
    });
    var a = safeDiv(t.run, t.planned), p = safeDiv(t.output, t.ideal);
    var q = t.output > 0 ? 1 - t.scrap / t.output : null;
    return Object.assign(t, {
      availability: a, performance: p, quality: q,
      oee: a === null || p === null || q === null ? null : a * p * q,
      good: t.output - t.scrap, scrapRate: safeDiv(t.scrap, t.output),
      coShare: safeDiv(t.coMin, t.planned)
    });
  }

  function groupBy(rows, fn) {
    var m = {};
    rows.forEach(function (r) { var k = fn(r); (m[k] = m[k] || []).push(r); });
    return m;
  }

  // Lundi de la semaine (ISO) d'une date AAAA-MM-JJ.
  function weekStart(iso) {
    var d = new Date(iso + "T00:00:00Z"), day = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - day);
    return d.toISOString().slice(0, 10);
  }

  // Taux starved / blocked par étape (en part des planned_min de l'étape) et identification du goulot.
  function flow(stageRows) {
    var by = groupBy(stageRows, function (r) { return r.stage; });
    var stages = STAGES.map(function (s) {
      var rows = by[s] || [], P = 0, st = 0, bl = 0, out = 0;
      rows.forEach(function (r) { P += r.planned_min; st += r.starved_min; bl += r.blocked_min; out += r.output_t; });
      return { stage: s, planned: P, starved: st, blocked: bl, output: out,
        starvedPct: safeDiv(st, P), blockedPct: safeDiv(bl, P), idlePct: safeDiv(st + bl, P) };
    });
    // Le goulot est l'étape qui attend le moins (ni affamée ni bloquée) : l'amont s'y bloque, l'aval y est affamé.
    var bottleneck = stages.reduce(function (best, s) {
      return s.idlePct !== null && (best === null || s.idlePct < best.idlePct) ? s : best;
    }, null);
    return { stages: stages, bottleneck: bottleneck ? bottleneck.stage : null };
  }

  // Impact économique des quatre problèmes, sur la période puis annualisé.
  // p : { margin €/t, downtimeCost €/h, smedPct, worstDownPct, bottleneckPct, scrapTarget (fractions 0-1) }.
  // Une minute perdue en extrusion vaut le débit réel de tonnes bonnes par heure de marche
  // (= cadence nominale × performance × qualité), de la ligne ou de l'usine.
  function impacts(rows, stageRows, p) {
    var plant = oee(rows);
    var days = Object.keys(groupBy(rows, function (r) { return r.date; })).length;
    var annual = safeDiv(365, days) || 0;
    var goodRate = function (o) { return safeDiv(o.good, o.run / 60) || 0; };
    var rate = goodRate(plant);
    var tOf = function (min, r) { return min / 60 * r; };

    var lines = Object.keys(groupBy(rows, function (r) { return r.machine; })).sort().map(function (m) {
      var o = oee(rows.filter(function (r) { return r.machine === m; }));
      o.machine = m; o.rate = goodRate(o); return o;
    });
    var worst = lines.reduce(function (a, b) { return b.down > a.down ? b : a; }, lines[0] || null);
    var others = lines.filter(function (l) { return l !== worst; });
    var othersAvgDown = safeDiv(others.reduce(function (s, l) { return s + l.down; }, 0), others.length) || 0;

    // 1. Pannes : toutes lignes ; levier = maintenance ciblée sur la pire ligne.
    var downT = tOf(plant.down, rate);
    var wRate = worst && worst.rate > 0 ? worst.rate : rate;
    var downGainMin = worst ? worst.down * p.worstDownPct : 0;
    var downGainT = tOf(downGainMin, wRate);
    var down = { id: "downtime", minutes: plant.down, tonnes: downT,
      cost: downT * p.margin + plant.down / 60 * p.downtimeCost,
      worst: worst, othersAvgDown: othersAvgDown, alignPct: worst && worst.down > 0 ? Math.max(0, 1 - othersAvgDown / worst.down) : 0,
      gainMin: downGainMin, gainT: downGainT * annual,
      gainEur: (downGainT * p.margin + downGainMin / 60 * p.downtimeCost) * annual };

    // 2. Changements de série : levier SMED (réduction du temps de changement).
    var coT = tOf(plant.coMin, rate);
    var co = { id: "changeover", minutes: plant.coMin, count: plant.co, tonnes: coT, cost: coT * p.margin,
      avgMin: safeDiv(plant.coMin, plant.co),
      gainMin: plant.coMin * p.smedPct, gainT: coT * p.smedPct * annual, gainEur: coT * p.smedPct * p.margin * annual };

    // 3. Rebut : levier plan qualité (ramener le taux de rebut à la cible).
    var scrapRate = plant.scrapRate || 0;
    var scrapGainT = Math.max(0, plant.output * (scrapRate - p.scrapTarget));
    var scrap = { id: "scrap", tonnes: plant.scrap, rate: scrapRate, output: plant.output, cost: plant.scrap * p.margin,
      gainT: scrapGainT * annual, gainEur: scrapGainT * p.margin * annual };

    // 4. Goulot : capacité amont bloquée par le goulot, valorisée au débit de l'étape amont.
    var f = flow(stageRows), idx = STAGES.indexOf(f.bottleneck);
    var src = idx > 0 ? f.stages[idx - 1] : f.stages[idx + 1];
    var lostMin = src ? (idx > 0 ? src.blocked : src.starved) : 0;
    var srcRun = src ? src.planned - src.starved - src.blocked : 0;
    var srcRate = src ? safeDiv(src.output, srcRun) || 0 : 0; // t par minute-unité de marche
    var bnT = lostMin * srcRate;
    var bn = { id: "bottleneck", stage: f.bottleneck, source: src ? src.stage : null, sourceKind: idx > 0 ? "blocked" : "starved",
      minutes: lostMin, ratePerUnitHour: srcRate * 60, tonnes: bnT, cost: bnT * p.margin,
      gainT: bnT * p.bottleneckPct * annual, gainEur: bnT * p.bottleneckPct * p.margin * annual };

    var problems = [bn, down, co, scrap].sort(function (a, b) { return b.cost - a.cost; });
    return { days: days, annual: annual, rate: rate, plant: plant, problems: problems,
      // Le goulot recoupe pannes et changements (ce sont eux qui limitent l'extrusion) : il n'est pas additionné.
      internalGainEur: down.gainEur + co.gainEur + scrap.gainEur,
      internalGainT: down.gainT + co.gainT + scrap.gainT };
  }

  // Constats pour l'onglet « Questions usine » : rebut et changements de série par ligne, équipe et mois.
  function diagnostics(rows) {
    var seg = function (keyFn) {
      var g = groupBy(rows, keyFn);
      return Object.keys(g).sort().map(function (k) {
        var o = oee(g[k]);
        return { key: k, scrapRate: o.scrapRate, co: o.co, coMin: o.coMin, minPerCo: safeDiv(o.coMin, o.co),
          days: Object.keys(groupBy(g[k], function (r) { return r.date; })).length };
      });
    };
    var range = function (list, f) {
      var v = list.map(f).filter(function (x) { return x !== null; });
      return v.length ? { min: Math.min.apply(null, v), max: Math.max.apply(null, v) } : { min: null, max: null };
    };
    var median = function (v) {
      var s = v.filter(function (x) { return x !== null; }).sort(function (a, b) { return a - b; }), n = s.length;
      return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null;
    };
    var machines = seg(function (r) { return r.machine; });
    var shifts = seg(function (r) { return r.shift; });
    var months = seg(function (r) { return r.date.slice(0, 7); });
    // Ligne hors norme : la plus éloignée de la médiane, si l'écart dépasse 0,5 point de rebut.
    var med = median(machines.map(function (m) { return m.scrapRate; }));
    var outlier = machines.reduce(function (a, m) {
      return m.scrapRate !== null && med !== null && Math.abs(m.scrapRate - med) > 0.005 &&
        (!a || Math.abs(m.scrapRate - med) > Math.abs(a.scrapRate - med)) ? m : a;
    }, null);
    var rest = machines.filter(function (m) { return m !== outlier; });
    var withCo = oee(rows.filter(function (r) { return r.changeovers > 0; }));
    var withoutCo = oee(rows.filter(function (r) { return r.changeovers === 0; }));
    return {
      plant: oee(rows), machines: machines, shifts: shifts, months: months,
      scrapOutlier: outlier, scrapMedian: med,
      scrapRange: { machines: range(rest, function (m) { return m.scrapRate; }), shifts: range(shifts, function (m) { return m.scrapRate; }),
        months: range(months, function (m) { return m.scrapRate; }) },
      minPerCoRange: { machines: range(machines, function (m) { return m.minPerCo; }), shifts: range(shifts, function (m) { return m.minPerCo; }) },
      scrapWithCo: withCo.scrapRate, scrapWithoutCo: withoutCo.scrapRate,
      coPerDay: months.map(function (m) { return { key: m.key, perDay: safeDiv(m.co, m.days) }; })
    };
  }

  // ---- Onglet « Problèmes & impact » : contrôle des données et familles MECE ----
  function sumOf(rows, f) { return rows.reduce(function (s, r) { return s + f(r); }, 0); }
  function stopsOf(r) { return r.changeover_min + r.unplanned_downtime_min + r.other_stop_min; }

  // Bilan temps : marche + arrêts vs planifié, ligne à ligne et en total.
  function timeBalance(rows) {
    var mismatches = rows.filter(function (r) { return Math.abs(r.run_min + stopsOf(r) - r.planned_min) > 1e-9; })
      .map(function (r) {
        return { date: r.date, shift: r.shift, machine: r.machine, planned: r.planned_min, run: r.run_min,
          stops: stopsOf(r), diff: r.run_min + stopsOf(r) - r.planned_min };
      });
    var planned = sumOf(rows, function (r) { return r.planned_min; });
    var run = sumOf(rows, function (r) { return r.run_min; });
    var stops = sumOf(rows, stopsOf);
    return { planned: planned, run: run, stops: stops, diff: run + stops - planned, mismatches: mismatches };
  }

  // Contrôle brut / retraité. Les ratios ne sont jamais plafonnés : une performance > 100 % reste visible.
  function dataControl(rawRows, cleanRows, stageRows) {
    var keyOf = function (r) { return r.date + "|" + r.shift + "|" + r.machine; };
    var groups = groupBy(rawRows, keyOf);
    var dupKeys = Object.keys(groups).filter(function (k) { return groups[k].length > 1; }).sort().map(function (k) {
      var g = groups[k], first = JSON.stringify(g[0]);
      return { key: k, count: g.length, exact: g.every(function (r) { return JSON.stringify(r) === first; }) };
    });
    var overCap = function (rows) {
      return rows.filter(function (r) { return r.run_min > 0 && r.output_t > r.run_min / 60 * r.ideal_rate_tph; }).length;
    };
    var dates = Object.keys(groupBy(rawRows, function (r) { return r.date; })).sort();
    var ext = stageRows.filter(function (r) { return r.stage === "extrusion"; });
    var stageExt = ext.length ? sumOf(ext, function (r) { return r.output_t; }) : null;
    var raw = oee(rawRows), clean = oee(cleanRows);
    return {
      period: { start: dates[0] || null, end: dates[dates.length - 1] || null, days: dates.length },
      raw: raw, clean: clean,
      dupKeys: dupKeys,
      exactDupKeys: dupKeys.filter(function (d) { return d.exact; }).length,
      contradictoryDupKeys: dupKeys.filter(function (d) { return !d.exact; }).length,
      removedRows: rawRows.length - cleanRows.length,
      outOfScale: rawRows.filter(function (r) { return r.output_t > KG_THRESHOLD_T; })
        .map(function (r) { return { date: r.date, shift: r.shift, machine: r.machine, output: r.output_t, scrap: r.scrap_t }; }),
      kgThreshold: KG_THRESHOLD_T,
      balanceRaw: timeBalance(rawRows), balanceClean: timeBalance(cleanRows),
      overCapacity: { raw: overCap(rawRows), clean: overCap(cleanRows) },
      stageExtrusionT: stageExt,
      gapRaw: stageExt === null ? null : raw.output - stageExt,
      gapClean: stageExt === null ? null : clean.output - stageExt
    };
  }

  // Constats par famille MECE, au périmètre des lignes fournies. null = non calculable.
  function meceFacts(rows, stageRows) {
    var p = oee(rows);
    var lines = Object.keys(groupBy(rows, function (r) { return r.machine; })).sort().map(function (m) {
      var o = oee(rows.filter(function (r) { return r.machine === m; })); o.machine = m; return o;
    });
    var worst = lines.reduce(function (a, b) { return !a || b.down > a.down ? b : a; }, null);
    var others = lines.filter(function (l) { return l !== worst; });
    var othersAvg = safeDiv(sumOf(others, function (l) { return l.down; }), others.length);
    var f = flow(stageRows), st = {};
    f.stages.forEach(function (s) { st[s.stage] = s; });
    var runH = p.run / 60;
    var d = diagnostics(rows);
    return {
      A: { plannedH: p.planned / 60, days: Object.keys(groupBy(rows, function (r) { return r.date; })).length,
        lines: lines.length, shifts: Object.keys(groupBy(rows, function (r) { return r.shift; })).length },
      B1: { minutes: p.down, share: safeDiv(p.down, p.planned),
        worst: worst && worst.down > 0 ? { machine: worst.machine, minutes: worst.down, share: safeDiv(worst.down, worst.planned) } : null,
        othersAvg: othersAvg, ratio: worst && othersAvg ? safeDiv(worst.down, othersAvg) : null, availability: p.availability },
      B2: { count: p.co, minutes: p.coMin, perCo: safeDiv(p.coMin, p.co), share: p.coShare },
      B3: { minutes: p.other, share: safeDiv(p.other, p.planned),
        mixingBlocked: st.mixing ? st.mixing.blockedPct : null, extrusionBlocked: st.extrusion ? st.extrusion.blockedPct : null,
        packingStarved: st.packing ? st.packing.starvedPct : null },
      C: { grossRate: safeDiv(p.output, runH), standardRate: safeDiv(p.ideal, runH), performance: p.performance },
      D: { yield: safeDiv(p.good, p.output), scrapRate: p.scrapRate, scrapT: p.scrap, goodT: p.good,
        outlier: d.scrapOutlier ? { machine: d.scrapOutlier.key, scrapRate: d.scrapOutlier.scrapRate } : null, median: d.scrapMedian },
      // Identité de référence : heures planifiées × disponibilité × cadence brute × rendement = tonnes bonnes.
      reference: { plannedH: p.planned / 60, availability: p.availability, grossRate: safeDiv(p.output, runH),
        yield: safeDiv(p.good, p.output), goodT: p.good },
      bottleneck: f.bottleneck,
      stages: f.stages
    };
  }

  root.PolymexKPI = { safeDiv: safeDiv, parseCSV: parseCSV, cleanShiftLog: cleanShiftLog, missingShifts: missingShifts,
    oee: oee, groupBy: groupBy, weekStart: weekStart, flow: flow, impacts: impacts, diagnostics: diagnostics,
    timeBalance: timeBalance, dataControl: dataControl, meceFacts: meceFacts, STAGES: STAGES };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const K = window.PolymexKPI;

const C = { navy: "#172B4D", navy2: "#2D4A7A", navy3: "#8FA3C4", accent: "#E8710A", ok: "#1F7A4D", muted: "#5E6C84", grid: "#E6E9EF" };
const STAGE_FR = { mixing: "Mélange", extrusion: "Extrusion", packing: "Conditionnement" };
const STAGE_THE = { mixing: "Le mélange", extrusion: "L'extrusion", packing: "Le conditionnement" };
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

const nf1 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (v === null || v === undefined ? "—" : nf1.format(v * 100) + " %");
const tons = (v) => (v === null || v === undefined ? "—" : nf1.format(v) + " t");
const mins = (v) => (v === null || v === undefined ? "—" : nf0.format(v) + " min");
const hours = (m) => nf0.format(m / 60) + " h";
const dShort = (iso) => { const [, m, d] = iso.split("-"); return `${Number(d)} ${MONTHS[Number(m) - 1]}`; };
const dLong = (iso) => { const [y, m, d] = iso.split("-"); return `${Number(d)} ${MONTHS[Number(m) - 1]} ${y}`; };

// ---------- Calculs ----------
function buildModel(shiftRaw, stageRaw) {
  const clean = K.cleanShiftLog(shiftRaw);
  const rows = clean.rows;
  const dates = [...new Set(rows.map((r) => r.date))].sort();
  const plant = K.oee(rows);

  const machines = Object.entries(K.groupBy(rows, (r) => r.machine))
    .map(([m, rs]) => ({ machine: m, ...K.oee(rs), rows: rs }))
    .sort((a, b) => a.machine.localeCompare(b.machine));

  const shifts = ["A", "B", "C"].map((s) => ({ shift: s, ...K.oee(rows.filter((r) => r.shift === s)) }));

  const weekly = (rs) => Object.entries(K.groupBy(rs, (r) => K.weekStart(r.date)))
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([w, wr]) => ({ week: w, days: new Set(wr.map((r) => r.date)).size, ...K.oee(wr) }));

  const stageClean = stageRaw;
  const flow = K.flow(stageClean);
  const stageWeekly = Object.entries(K.groupBy(stageClean, (r) => K.weekStart(r.date)))
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([w, wr]) => {
      const f = K.flow(wr);
      const o = { week: w };
      f.stages.forEach((s) => { o[s.stage] = s; });
      return o;
    });

  return {
    clean, rows, dates, plant, machines, shifts, stageRows: stageClean,
    // Lignes brutes conservées en lecture seule pour le contrôle brut / retraité de l'onglet Problèmes & impact.
    rawRows: Object.freeze(shiftRaw.slice()), control: K.dataControl(shiftRaw, rows, stageClean),
    idealPlannedT: rows.reduce((s, r) => s + r.planned_min / 60 * r.ideal_rate_tph, 0),
    weeks: weekly(rows), weeklyOf: (m) => weekly(rows.filter((r) => r.machine === m)),
    missing: K.missingShifts(rows), flow, stageWeekly,
    stageOutput: Object.fromEntries(flow.stages.map((s) => [s.stage, s.output])),
  };
}

// ---------- Graphiques SVG ----------
function useHover() { const [h, setH] = useState(null); return [h, setH]; }

// Maximum d'axe « rond » (4 graduations de pas 1, 2, 2,5 ou 5 × 10^n).
function niceMax(v) {
  if (!(v > 0)) return 1;
  const raw = v / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((k) => k >= raw);
  return step * 4;
}

// Barres verticales sur une catégorie temporelle.
function Bars({ data, value, label, fmt, height = 200, width = 720, color = C.navy, highlight, yMax, refLine }) {
  const [h, setH] = useHover();
  const W = width, H = height, pl = 52, pr = 12, pt = 16, pb = 30;
  const max = yMax || niceMax(Math.max(...data.map(value).filter((v) => v !== null), 0));
  const bw = (W - pl - pr) / data.length;
  const y = (v) => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => t * max);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img">
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={pl} x2={W - pr} y1={y(t)} y2={y(t)} stroke={C.grid} />
          <text x={pl - 6} y={y(t) + 4} textAnchor="end" fontSize="11" fill={C.muted}>{fmt.axis(t)}</text>
        </g>
      ))}
      {refLine !== undefined && (
        <g>
          <line x1={pl} x2={W - pr} y1={y(refLine.v)} y2={y(refLine.v)} stroke={C.muted} strokeDasharray="4 3" />
          <text x={W - pr} y={y(refLine.v) - 4} textAnchor="end" fontSize="11" fill={C.muted}>{refLine.label}</text>
        </g>
      )}
      {data.map((d, i) => {
        const v = value(d);
        if (v === null) return null;
        const x = pl + i * bw + bw * 0.15, top = y(v);
        const fill = highlight && highlight(d) ? C.accent : color;
        return (
          <g key={i} onMouseEnter={() => setH(i)} onMouseLeave={() => setH(null)}>
            <rect x={pl + i * bw} y={pt} width={bw} height={H - pt - pb} fill="transparent" />
            <rect x={x} y={top} width={bw * 0.7} height={Math.max(0, y(0) - top)} rx="2" fill={fill} opacity={h === null || h === i ? 1 : 0.55} />
            {(i % Math.ceil(data.length / 13) === 0) && (
              <text x={x + bw * 0.35} y={H - 10} textAnchor="middle" fontSize="11" fill={C.muted}>{label(d)}</text>
            )}
          </g>
        );
      })}
      {h !== null && value(data[h]) !== null && (() => {
        const x = Math.min(Math.max(pl + h * bw + bw / 2, pl + 70), W - pr - 70), top = y(value(data[h]));
        return (
          <g pointerEvents="none">
            <rect x={x - 70} y={Math.max(0, top - 30)} width="140" height="22" rx="4" fill={C.navy} />
            <text x={x} y={Math.max(0, top - 30) + 15} textAnchor="middle" fontSize="12" fill="#fff">{label(data[h])} · {fmt.tip(value(data[h]))}</text>
          </g>
        );
      })()}
    </svg>
  );
}

// Courbes multiples sur une catégorie temporelle.
function Lines({ data, series, label, fmt, height = 220, width = 720, yMax, yMin = 0 }) {
  const [h, setH] = useHover();
  const W = width, H = height, pl = 52, pr = 12, pt = 16, pb = 30;
  const all = data.flatMap((d) => series.map((s) => s.value(d))).filter((v) => v !== null);
  const max = yMax || niceMax(Math.max(...all));
  const step = (W - pl - pr) / Math.max(1, data.length - 1);
  const xs = (i) => pl + i * step;
  const y = (v) => pt + (H - pt - pb) * (1 - (v - yMin) / (max - yMin));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => yMin + t * (max - yMin));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img"
      onMouseLeave={() => setH(null)}
      onMouseMove={(e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const px = ((e.clientX - r.left) / r.width) * W;
        setH(Math.min(data.length - 1, Math.max(0, Math.round((px - pl) / step))));
      }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={pl} x2={W - pr} y1={y(t)} y2={y(t)} stroke={C.grid} />
          <text x={pl - 6} y={y(t) + 4} textAnchor="end" fontSize="11" fill={C.muted}>{fmt.axis(t)}</text>
        </g>
      ))}
      {data.map((d, i) => (i % Math.ceil(data.length / 13) === 0) && (
        <text key={i} x={xs(i)} y={H - 10} textAnchor="middle" fontSize="11" fill={C.muted}>{label(d)}</text>
      ))}
      {series.map((s) => {
        const pts = data.map((d, i) => [xs(i), s.value(d)]).filter(([, v]) => v !== null);
        return (
          <g key={s.name}>
            <polyline fill="none" stroke={s.color} strokeWidth="2.5" strokeLinejoin="round" points={pts.map(([x, v]) => `${x},${y(v)}`).join(" ")} />
            {pts.map(([x, v], i) => <circle key={i} cx={x} cy={y(v)} r="3" fill={s.color} />)}
          </g>
        );
      })}
      {h !== null && (() => {
        const x = xs(h), bx = Math.min(Math.max(x + 8, pl), W - pr - 190);
        return (
          <g pointerEvents="none">
            <line x1={x} x2={x} y1={pt} y2={H - pb} stroke={C.muted} strokeDasharray="3 3" />
            <rect x={bx} y={pt} width="190" height={22 + series.length * 18} rx="4" fill={C.navy} />
            <text x={bx + 10} y={pt + 16} fontSize="12" fill="#fff" fontWeight="600">{label(data[h])}</text>
            {series.map((s, i) => (
              <text key={s.name} x={bx + 10} y={pt + 34 + i * 18} fontSize="12" fill="#fff">
                <tspan fill={s.color === C.navy ? "#9FB3D9" : s.color}>■ </tspan>{s.name} : {fmt.tip(s.value(data[h]))}
              </text>
            ))}
          </g>
        );
      })()}
    </svg>
  );
}

// Barre horizontale simple (classement, part d'un tout).
function HBar({ v, max = 1, color = C.navy, h = 10 }) {
  const w = v === null ? 0 : Math.max(0, Math.min(1, v / max)) * 100;
  return (
    <div className="w-full rounded-sm" style={{ background: C.grid, height: h }}>
      <div className="rounded-sm" style={{ width: `${w}%`, background: color, height: h }} />
    </div>
  );
}

function Legend({ items }) {
  return (
    <div className="flex flex-wrap gap-4 text-sm" style={{ color: C.muted }}>

}

  const { stages, bottleneck } = M.flow;
  const ext = stages.find((s) => s.stage === "extrusion");

  const pack = stages.find((s) => s.stage === "packing");
  const maxPct = Math.max(...stages.flatMap((s) => [s.starvedPct, s.blockedPct]));
  return (
    <div className="space-y-5">
      <Card title="Flux mélange → extrusion → conditionnement" sub="Minutes-unités en attente, en part du temps planifié de chaque étape (7 unités par étape)">

            return (
              <React.Fragment key={s.stage}>

            Le mélange est bloqué {pct(mix.blockedPct)} du temps parce que l'extrusion n'absorbe pas son débit,
            et le conditionnement attend l'extrusion {pct(pack.starvedPct)} du temps. L'extrusion, elle, n'est presque jamais
            à l'arrêt pour cause de flux ({pct(ext.idlePct)}) : c'est elle qui fixe la cadence de l'usine.
            Chaque point de TRS gagné en extrusion (aujourd'hui {pct(M.plant.oee)}) vaut ≈ {tons(M.idealPlannedT * 0.01 * E.impacts.annual)} bonnes par an,

          { name: "Conditionnement affamé", color: C.accent },
          { name: "Extrusion affamée + bloquée", color: C.navy3 },
        ]} />
        <Lines data={M.stageWeekly}
          series={[
            { name: "Mélange bloqué", value: (d) => d.mixing.blockedPct, color: C.navy },
            { name: "Cond. affamé", value: (d) => d.packing.starvedPct, color: C.accent },
            { name: "Extrusion en attente", value: (d) => d.extrusion.idlePct, color: C.navy3 },
          ]}

            </div>
          ))}
        </div>
        <p className="text-sm mt-3" style={{ color: C.muted }}>
          Le tonnage d'extrusion du flux ({tons(ext.output)}) recoupe le journal des lignes après correction ({tons(M.plant.output)}).
        </p>
      </Card>
    </div>
  );
}

// ---------- Hypothèses économiques ----------
// Les pourcentages sont saisis en % dans l'interface et convertis en fractions pour kpi-lib.
// Prix de vente par défaut : chiffre d'affaires et tonnage annuels du brief (README).
const BRIEF_REVENUE_EUR = 148e6, BRIEF_TONNES = 86000;
const PARAMS = {
  margin: { label: "Marge sur coûts variables", unit: "€/t", def: 300, min: 0, max: 1000, step: 10 },
  downtimeCost: { label: "Coût direct d'une heure d'arrêt non planifié", unit: "€/h", def: 250, min: 0, max: 2000, step: 10,
    hint: "Hors marge perdue : intervention, pièces, main d'œuvre immobilisée." },
  smedPct: { label: "SMED : réduction du temps de changement", unit: "%", def: 30, min: 0, max: 80, step: 5, pct: true },
  worstDownPct: { label: "Maintenance : réduction des pannes de la pire ligne", unit: "%", def: 50, min: 0, max: 90, step: 5, pct: true },
  bottleneckPct: { label: "Capacité : part du blocage amont récupérée", unit: "%", def: 50, min: 0, max: 100, step: 5, pct: true },
  scrapTarget: { label: "Taux de rebut cible", unit: "%", def: 4, min: 0, max: 10, step: 0.5, pct: true },
  price: { label: "Prix de vente moyen", unit: "€/t", def: Math.round(BRIEF_REVENUE_EUR / BRIEF_TONNES),
    hint: "Défaut : 148 M€ de CA / 86 000 t par an (brief)." },
  operators: { label: "Opérateurs par ligne et par équipe", unit: "pers.", def: 2 },
  energyPrice: { label: "Coût de l'électricité", unit: "€/MWh", def: 150 },
  energyKwhT: { label: "Consommation électrique de l'extrusion", unit: "kWh/t", def: 350 },
};
const HYP_KEYS = ["margin", "downtimeCost", "smedPct", "worstDownPct", "bottleneckPct", "scrapTarget"];
const FIELD_CARDS = [
  { key: "margin", title: "Vraie marge par tonne", who: "Contrôle de gestion" },
  { key: "price", title: "Prix de vente moyen", who: "Direction commerciale" },
  { key: "downtimeCost", title: "Coût d'une heure de panne", who: "Responsable maintenance" },
  { key: "scrapTarget", title: "Taux de rebut cible", who: "Responsable qualité" },
  { key: "operators", title: "Effectifs en extrusion", who: "Responsable production" },
  { key: "energyPrice", title: "Prix de l'électricité", who: "Achats / services généraux" },
  { key: "energyKwhT", title: "Consommation par tonne", who: "Méthodes / énergie" },
];
const STORE_KEY = "polymex-cockpit-assumptions-v1";

function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (s && typeof s === "object") return { hyp: s.hyp || {}, field: s.field || {} };
  } catch (e) { /* stockage indisponible : on repart des valeurs par défaut */ }
  return { hyp: {}, field: {} };
}

// Valeur effective : saisie terrain > hypothèse réglée > défaut.
function useAssumptions() {
  const [store, setStore] = useState(loadStore);
  const [resetKey, setResetKey] = useState(0);
  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignoré */ } }, [store]);
  const values = {};
  Object.keys(PARAMS).forEach((k) => { values[k] = store.field[k] ?? store.hyp[k] ?? PARAMS[k].def; });
  const lib = {};
  Object.keys(PARAMS).forEach((k) => { lib[k] = PARAMS[k].pct ? values[k] / 100 : values[k]; });
  return {
    values, lib, store, resetKey,
    pending: FIELD_CARDS.filter((c) => store.field[c.key] === undefined).length,
    confirmed: (k) => store.field[k] !== undefined,
    setHyp: (k, v) => setStore((s) => ({ ...s, hyp: { ...s.hyp, [k]: v } })),
    setField: (k, v) => setStore((s) => {
      const field = { ...s.field };
      if (v === undefined) delete field[k]; else field[k] = v;
      return { ...s, field };
    }),
    reset: () => { setStore({ hyp: {}, field: {} }); setResetKey((n) => n + 1); },
  };
}

const eur = (v) => {
  if (v === null || v === undefined || !Number.isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e6) return nf1.format(v / 1e6) + " M€";
  if (a >= 1e4) return nf0.format(v / 1e3) + " k€";
  return nf0.format(v) + " €";
};
const fmtParam = (k, v) => (PARAMS[k].pct ? nf1.format(v) : nf0.format(v)) + " " + PARAMS[k].unit;

function Badge({ ok }) {
  return ok
    ? <span className="text-xs font-semibold px-2 py-0.5 rounded" style={{ background: "#E6F2EC", color: C.ok }}>Valeur terrain</span>

}

function AssumptionsPanel({ A }) {
  return (
    <section className="card p-5 xl:sticky xl:top-4">

      <div className="space-y-5">
        {HYP_KEYS.map((k) => {
          const p = PARAMS[k], locked = A.confirmed(k);
          return (
            <div key={k}>
              <div className="flex justify-between items-baseline gap-2">
                <label htmlFor={`hyp-${k}`} className="text-sm font-medium">{p.label}</label>

      </div>
      <div className="mt-5 pt-4 flex items-center justify-between gap-3" style={{ borderTop: `1px solid ${C.grid}` }}>
        <span className="text-xs" style={{ color: C.muted }}>Valeurs enregistrées dans ce navigateur.</span>
        <button className="text-sm font-semibold px-3 py-1.5 rounded border" style={{ color: C.navy, borderColor: C.grid }}

}

function FieldCard({ card, A }) {
  const p = PARAMS[card.key], saved = A.store.field[card.key];
  const [draft, setDraft] = useState(saved === undefined ? "" : String(saved).replace(".", ","));
  const [invalid, setInvalid] = useState(false);
  const onChange = (e) => {
    const raw = e.target.value;
    setDraft(raw);
    if (raw.trim() === "") { setInvalid(false); A.setField(card.key, undefined); return; }
    const n = Number(raw.replace(/\s/g, "").replace(",", "."));
    if (Number.isFinite(n) && n >= 0) { setInvalid(false); A.setField(card.key, n); } else setInvalid(true);
  };
  return (
    <div className="card p-4 flex flex-col gap-2" style={{ borderTop: `3px solid ${saved === undefined ? C.accent : C.ok}` }}>
      <div className="flex justify-between items-start gap-2">
        <span className="font-semibold" style={{ color: C.navy }}>{card.title}</span>
        {saved === undefined ? <Badge ok={false} /> : null}
      </div>
      <div className="text-xs" style={{ color: C.muted }}>À demander : {card.who}</div>
      <div className="flex items-center rounded border" style={{ borderColor: invalid ? C.accent : C.grid }}>
        <input type="text" inputMode="decimal" className="num w-full px-3 py-2 text-lg outline-none rounded" placeholder={nf0.format(p.def)}
          value={draft} onChange={onChange} aria-label={card.title} />
        <span className="px-3 text-sm" style={{ color: C.muted }}>{p.unit}</span>
      </div>
      <div className="text-xs" style={{ color: invalid ? C.accent : C.muted }}>
        {invalid ? "Nombre positif attendu." : saved === undefined ? `Valeur par défaut utilisée : ${fmtParam(card.key, p.def)}` : `Utilisée partout dans le cockpit.`}
      </div>
    </div>
  );
}

// ---------- Onglet 4 : problèmes et impact (schéma MECE) ----------
// Lecture « du constat au gain » : contrôle des données → familles de pertes → carte standard → cascade d'impact.
// Aucun gain n'est affiché tant que le verrou n'est pas levé (données validées + entrées économiques renseignées).
const MECE_STORE_KEY = "polymex-cockpit-mece-v1";

function useMece() {
  const [store, setStore] = useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem(MECE_STORE_KEY) || "null");
      if (s && typeof s === "object") return { checks: s.checks || {}, collect: s.collect || {}, fiches: s.fiches || {} };
    } catch (e) { /* stockage indisponible : on repart à vide */ }
    return { checks: {}, collect: {}, fiches: {} };
  });
  useEffect(() => { try { localStorage.setItem(MECE_STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignoré */ } }, [store]);
  return {
    store,
    setCheck: (k, v) => setStore((s) => ({ ...s, checks: { ...s.checks, [k]: v } })),
    setCollect: (k, v) => setStore((s) => ({ ...s, collect: { ...s.collect, [k]: v } })),
    setFiche: (code, patch) => setStore((s) => ({ ...s, fiches: { ...s.fiches, [code]: { ...(s.fiches[code] || {}), ...patch } } })),
  };
}

// Valeur absente ou non finie : jamais NaN, Infinity ou 0 trompeur.
const nc = (v, f) => (v === null || v === undefined || !Number.isFinite(v) ? "non calculable" : f(v));
const pctNc = (v) => nc(v, (x) => nf1.format(x * 100) + " %");
const filled = (v) => v !== undefined && v !== null && String(v).trim() !== "";

const DATA_CHECKS = [
  { key: "units", label: "Unités confirmées", detail: "t ou kg pour les valeurs hors échelle" },
  { key: "duplicates", label: "Doublons expliqués", detail: "double import ou enregistrements réels" },
  { key: "rates", label: "Standards de cadence validés", detail: "ideal_rate_tph par ligne et par recette" },
  { key: "volumes", label: "Définition des volumes validée", detail: "brut, bon, retouché, vendu" },
];

// Entrées économiques. source : "q" = Questions usine, "field" = encart terrain existant, "collect" = nouveau champ.
const COLLECT_ITEMS = [
  { key: "demand", label: "Demande servable", source: "q", required: true, hint: "Saisie dans l'onglet Questions usine (carte capacité)." },
  { key: "mix", label: "Mix par recette", source: "collect", required: true, placeholder: "Recettes, parts du volume…" },
  { key: "recipeRate", label: "Cadence standard par recette", source: "collect", required: true, placeholder: "t/h par recette et par ligne" },
  { key: "downstreamCap", label: "Capacité aval disponible (packing)", source: "collect", required: true, placeholder: "t/mois disponibles" },
  { key: "margin", label: "Marge contributive €/t", source: "field", required: true, hint: "Encart « Vraie marge par tonne » ci-dessous." },
  { key: "price", label: "Prix net et consommations", source: "field", required: false, hint: "Encarts prix, électricité et consommation ci-dessous." },
  { key: "calendar", label: "Calendrier d'ouverture", source: "collect", required: true, placeholder: "Jours ouverts / an, équipes" },
  { key: "stocks", label: "Stocks et encours", source: "collect", required: false, placeholder: "Stock initial / final, encours" },
  { key: "planCosts", label: "Coûts du plan d'actions", source: "collect", required: true, placeholder: "€, par action" },
  { key: "horizon", label: "Horizon de calcul", source: "collect", required: true, placeholder: "Ex. 12 mois à partir de…" },
];

function collectState(item, X, A, Q) {
  if (item.source === "q") return filled(Q.get("capacity").fields.demand);
  if (item.source === "field") return item.key === "price" ? A.confirmed("price") : A.confirmed(item.key);
  return filled(X.store.collect[item.key]);
}

function lockState(X, A, Q) {
  const checksOk = DATA_CHECKS.filter((c) => X.store.checks[c.key]).length;
  const req = COLLECT_ITEMS.filter((i) => i.required);
  const reqOk = req.filter((i) => collectState(i, X, A, Q)).length;
  return { checksOk, checksTotal: DATA_CHECKS.length, reqOk, reqTotal: req.length,
    locked: checksOk < DATA_CHECKS.length || reqOk < req.length };
}

function Pill({ tone = "warn", children }) {
  const t = { warn: ["#FDEBDD", "#9A4A06"], ok: ["#E6F2EC", C.ok], info: ["#E9EEF6", C.navy], mute: ["#F4F5F7", C.muted] }[tone];
  return <span className="inline-block text-xs font-semibold px-2 py-0.5 rounded whitespace-nowrap" style={{ background: t[0], color: t[1] }}>{children}</span>;
}

function Arrow({ down }) {
  return <div className="flex items-center justify-center text-2xl leading-none select-none" style={{ color: C.navy3 }} aria-hidden="true">{down ? "↓" : "→"}</div>;
}

        <div className="grid grid-cols-[minmax(0,1fr)_auto_auto] gap-x-4 text-sm num">
          <div className="py-2 text-xs font-bold uppercase tracking-wide" style={{ color: C.muted, borderBottom: `1px solid ${C.grid}` }}>Indicateur</div>
          <div className="py-2 text-xs font-bold uppercase tracking-wide text-right" style={{ color: C.muted, borderBottom: `1px solid ${C.grid}` }}>Brut</div>

            <React.Fragment key={l}>
              <div className="py-1.5" style={{ borderBottom: `1px solid ${C.grid}` }}>{l}</div>
              <div className="py-1.5 text-right whitespace-nowrap" style={{ borderBottom: `1px solid ${C.grid}`, color: warn ? C.accent : C.ink, fontWeight: warn ? 600 : 400 }}>{a}</div>
              <div className="py-1.5 text-right whitespace-nowrap" style={{ borderBottom: `1px solid ${C.grid}` }}>{b}</div>
            </React.Fragment>
          ))}
        </div>
        <p className="text-xs mt-2" style={{ color: C.muted }}>En orange : ratio supérieur à 100 %, physiquement incohérent. Il est affiché tel quel, jamais plafonné.</p>
      </div>

      <div className="mt-4 p-4 rounded" style={{ border: `1px solid ${C.grid}` }}>
        <div className="flex flex-wrap items-baseline justify-between gap-2">
          <h3 className="font-semibold" style={{ color: C.navy }}>Verrou des impacts : {lock.locked ? "fermé" : "entrées complètes"}</h3>
          <span className="text-sm num" style={{ color: C.muted }}>Données validées {lock.checksOk}/{lock.checksTotal} · Entrées économiques {lock.reqOk}/{lock.reqTotal}</span>
        </div>
        <p className="text-sm mt-1" style={{ color: C.muted }}>Le retraitement seul ne déverrouille pas les impacts. Cocher seulement après confirmation par l'usine.</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3">
          {DATA_CHECKS.map((d) => (
            <label key={d.key} className="flex items-start gap-2 text-sm cursor-pointer">
              <input type="checkbox" className="mt-1" checked={!!X.store.checks[d.key]} onChange={(e) => X.setCheck(d.key, e.target.checked)} style={{ accentColor: C.ok }} />
              <span><b style={{ color: C.navy }}>{d.label}</b> <span style={{ color: C.muted }}>({d.detail})</span></span>

      <details className="mt-4">
        <summary className="cursor-pointer text-sm font-semibold" style={{ color: C.navy }}>Période, sources, périmètre et formules</summary>
        <div className="mt-3 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
          <div className="space-y-1.5">
            <p><b>Période :</b> {ctl.period.start ? `${dLong(ctl.period.start)} – ${dLong(ctl.period.end)} (${ctl.period.days} jours)` : "non calculable"}.</p>
            <p><b>Sources :</b> extrusion_shift_log.csv ({nf0.format(r.n)} lignes brutes), stage_daily.csv ({nf0.format(M.stageRows.length)} lignes).</p>
            <p><b>Périmètre brut :</b> toutes les lignes telles que déclarées.</p>
            <p><b>Périmètre retraité :</b> doublons exacts retirés, valeurs hors échelle divisées par 1 000. Hypothèses non validées.</p>
          </div>
          <ul className="space-y-1 text-xs" style={{ fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace", color: C.muted }}>
            <li>Disponibilité = Σ run_min / Σ planned_min</li>
            <li>Performance = Σ output_t / Σ (run_min / 60 × ideal_rate_tph)</li>
            <li>Qualité = Σ (output_t − scrap_t) / Σ output_t</li>
            <li>TRS = disponibilité × performance × qualité</li>
            <li>Bilan temps = run + changeover + unplanned_downtime + other_stop − planned</li>
            <li>Écart = Σ output_t (journal) − Σ output_t (stage_daily, extrusion)</li>
          </ul>
        </div>
      </details>
    </section>
  );
}

// ---- Familles MECE : une seule structure pour le tableau desktop et les cartes mobiles ----
function meceFamilies(F, ctl, A) {
  const fmtMin = (v) => nc(v, (x) => nf0.format(x) + " min");
  return [
    { code: "A", name: "Temps ouvert / capacité",
      facts: [
        `${nc(F.A.plannedH, (x) => nf0.format(x) + " h")} planifiées sur ${F.A.days} jours (${F.A.lines} lignes, ${F.A.shifts} équipes), périmètre retraité.`,
        "Demande et mix : à collecter.",
        `Flux compatible avec une contrainte en ${F.bottleneck ? STAGE_FR[F.bottleneck].toLowerCase() : "étape non identifiée"} : pas une preuve de besoin d'investissement.`,
      ],
      question: "Quelle demande par recette, quel besoin d'heures et d'unités ?",
      lever: "Rééquilibrer (calendrier, mix, séquencement) avant d'ajouter de la capacité." },
    { code: "B1", name: "Arrêts non planifiés",
      facts: [
        `${fmtMin(F.B1.minutes)} de pannes, ${pctNc(F.B1.share)} du planifié (retraité ; brut : ${fmtMin(ctl.raw.down)}).`,
        F.B1.worst ? `Ligne la plus touchée : ${F.B1.worst.machine}, ${fmtMin(F.B1.worst.minutes)}, ${nc(F.B1.ratio, (x) => nf1.format(x) + " ×")} la moyenne des autres lignes.` : "Ligne la plus touchée : non calculable.",
      ],
      question: "Quels modes de panne, quels temps de réparation ?",
      lever: "Maintenance ciblée à tester sur la ligne la plus touchée." },
    { code: "B2", name: "Changements de série",
      facts: [
        `${nf0.format(F.B2.count)} changements, ${fmtMin(F.B2.minutes)}, ${fmtMin(F.B2.perCo)} par changement, ${pctNc(F.B2.share)} du planifié (retraité ; brut : ${nf0.format(ctl.raw.co)} changements). Indicatif, non validé.`,
        "Une durée comparable entre équipes ne démontre pas l'absence de problème de compétences.",
      ],
      question: "Durée × fréquence : quelles étapes internes et externes ? Quelle politique de tailles de lots ?",
      lever: "SMED, séquencement des recettes, tailles de lots." },
    { code: "B3", name: "Autres arrêts",
      facts: [
        `${fmtMin(F.B3.minutes)} d'other_stop_min, ${pctNc(F.B3.share)} du planifié : code agrégé, non détaillé.`,
        `stage_daily (fichier distinct) : mélange bloqué ${pctNc(F.B3.mixingBlocked)}, extrusion bloquée ${pctNc(F.B3.extrusionBlocked)}, conditionnement sans alimentation ${pctNc(F.B3.packingStarved)}.`,
      ],
      question: "Attente matière ou aval, pauses, nettoyage, utilités, autres ?",

        `${nc(F.C.grossRate, (x) => nf2.format(x) + " t")} brutes par heure de marche vs ${nc(F.C.standardRate, (x) => nf2.format(x) + " t/h")} de référence : performance ${pctNc(F.C.performance)} (retraité ; brut : ${pctNc(ctl.raw.performance)}).`,
        "Référentiel de cadence à confirmer : identique pour les 7 lignes, sans recette.",
      ],
      question: "Vitesse standard par recette, micro-arrêts, réglages, vitesse réelle ?",
      lever: "Un micro-arrêt est imputé au temps OU à la cadence, jamais aux deux." },
    { code: "D", name: "Qualité / rendement",
      facts: [
        `Rendement ${pctNc(F.D.yield)} (tonnes bonnes / tonnes brutes) ; rebut + retouche non vendable ${nc(F.D.scrapRate, pct2)}, retraité, à valider.`,
        F.D.outlier ? `Ligne hors norme calculée : ${F.D.outlier.machine} à ${pct2(F.D.outlier.scrapRate)} (médiane ${nc(F.D.median, pct2)}). Hypothèse, pas un problème machine démontré.` : "Aucune ligne hors norme calculée.",
      ],
      question: "Défauts, lots matière, recettes, réglages, maintenance, compétences ?",
      lever: "Hypothèses à tester : aucune cause n'est confirmée par les données." },
    { code: "E", name: "Marge par tonne",
      facts: [
        "Prix net, mix et coûts variables : non documentés par les CSV, à collecter.",
        A.confirmed("margin") ? `Marge saisie par l'usine : ${nf0.format(A.values.margin)} €/t.` : `Marge par défaut de la démonstration : ${nf0.format(A.values.margin)} €/t, hypothèse non validée.`,
      ],
      question: "Prix net et consommations × prix (matière, énergie, main-d'œuvre variable) ?",
      lever: "Un rebut compté en D peut être rattaché ici, mais pas valorisé une seconde fois." },
    { code: "F", name: "Charges fixes",
      facts: ["P&L et coûts fixes non fournis : à collecter."],
      question: "Effectifs fixes, amortissements, structure : réel vs budget à périmètre constant ?",
      lever: "Séparer variable et fixe une seule fois." },
  ];
}

// ---- Carte standard : du constat à l'action ----
const CHAIN_1 = ["Constat + source", "Famille primaire", "Hypothèse causale", "Test terrain", "Action / responsable"];
const CHAIN_2 = ["Cible validée", "Tonnes bonnes nettes récupérables", "Gain net en €/an", "Niveau de confiance"];
const Q_LINK = { A: "capacity", B2: "changeover", D: "quality" };

function Chain({ steps }) {
  return (
    <div className="flex flex-col md:flex-row md:flex-wrap md:items-center gap-1.5">
      {steps.map((s, i) => (
        <React.Fragment key={s}>
          <span className="rounded px-3 py-1.5 text-sm font-semibold text-center" style={{ background: "#E9EEF6", color: C.navy }}>{s}</span>
          {i < steps.length - 1 && <><span className="hidden md:inline" style={{ color: C.navy3 }}>→</span><span className="md:hidden text-center" style={{ color: C.navy3 }}>↓</span></>}
        </React.Fragment>
      ))}
    </div>
  );
}

function FField({ label, children }) {
  return <label className="block"><span className="text-sm font-medium" style={{ color: C.navy }}>{label}</span><div className="mt-1">{children}</div></label>;
}
const inputCls = "w-full px-3 py-2 rounded border outline-none text-base bg-white";

function StandardCard({ fams, X, Q, M, lock }) {
  const [code, setCode] = useState("A");
  const fam = fams.find((f) => f.code === code);
  const fi = X.store.fiches[code] || {};
  const set = (k) => (e) => X.setFiche(code, { [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });
  const q = Q_LINK[code] ? Q.get(Q_LINK[code]) : null;
  const qLabel = q ? (Q_STATUS.find((s) => s.key === q.status) || Q_STATUS[0]).label : null;
  const sel = (k, opts) => (
    <select className={inputCls} style={{ borderColor: C.grid }} value={fi[k] || ""} onChange={set(k)}>
      <option value="">—</option>{opts.map((o) => <option key={o} value={o}>{o}</option>)}
    </select>
  );
  const txt = (k, ph) => <input type="text" className={inputCls} style={{ borderColor: C.grid }} value={fi[k] || ""} placeholder={ph} onChange={set(k)} />;
  return (
    <Card title="Carte standard : du constat à l'action" sub="Une seule famille primaire par problème. Étape, ligne, équipe et 5M sont des étiquettes transverses, pas des familles additives.">
      <div className="space-y-2">
        <Chain steps={CHAIN_1} />
        <div className="md:hidden text-center" style={{ color: C.navy3 }}>↓</div>
        <Chain steps={CHAIN_2} />
      </div>

      <div className="flex flex-wrap gap-2 mt-5" role="tablist" aria-label="Famille primaire">
        {fams.map((f) => {
          const st = X.store.fiches[f.code] || {};
          return (
            <button key={f.code} onClick={() => setCode(f.code)} role="tab" aria-selected={code === f.code}
              className="px-3 py-1.5 rounded text-sm font-semibold border num"
              style={code === f.code ? { background: C.navy, color: "#fff", borderColor: C.navy } : { color: C.navy, borderColor: C.grid, background: "#fff" }}>
              {f.code}{st.cause === "confirmée" ? " ✓" : ""}
            </button>
          );
        })}
      </div>

      <div className="mt-4 rounded p-4" style={{ border: `1px solid ${C.grid}` }}>
        <div className="flex flex-wrap items-center justify-between gap-2">
          <h3 className="font-semibold" style={{ color: C.navy }}>Fiche {fam.code} · famille primaire : {fam.name}</h3>
          <div className="flex flex-wrap gap-1.5">
            {fi.cause === "confirmée" ? <Pill tone="ok">Cause confirmée</Pill> : <Pill tone="warn">À vérifier</Pill>}
            {fi.actionDecided && <Pill tone="info">Action décidée</Pill>}
          </div>
        </div>
        <div className="text-sm mt-2 p-3 rounded num" style={{ background: "#F4F5F7" }}>
          <span className="text-xs font-bold uppercase tracking-wide" style={{ color: C.muted }}>Constat calculé · source extrusion_shift_log / stage_daily</span>
          <div className="mt-1">{fam.facts[0]}</div>
        </div>
        {q && (
          <p className="text-xs mt-2" style={{ color: C.muted }}>
            Réponses terrain associées : onglet Questions usine (statut « {qLabel} »). Elles restent la source pour ce sujet.
          </p>
        )}

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
          <FField label="Constat terrain + source">{txt("constat", "Ex. relevé maintenance du…")}</FField>
          <FField label="Hypothèse causale">{txt("hypothesis")}</FField>
          <FField label="Test terrain">{txt("test", "Comment la vérifier, sur quelles données")}</FField>
          <FField label="Action">{txt("action")}</FField>
          <FField label="Responsable">{txt("owner")}</FField>
          <div className="grid grid-cols-2 gap-3">
            <FField label="Étape">{sel("stage", ["mixing", "extrusion", "packing"])}</FField>
            <FField label="Ligne">{sel("line", ["toutes", ...M.machines.map((m) => m.machine)])}</FField>
            <FField label="Équipe">{sel("shift", ["toutes", "A", "B", "C"])}</FField>
            <FField label="5M">{sel("m5", ["Matière", "Machine", "Méthode", "Main-d'œuvre", "Milieu"])}</FField>
          </div>
        </div>

        <div className="flex flex-wrap gap-x-6 gap-y-2 mt-4 text-sm">
          <span className="font-medium" style={{ color: C.navy }}>Cause :</span>
          {["à vérifier", "confirmée"].map((v) => (
            <label key={v} className="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name={`cause-${code}`} checked={(fi.cause || "à vérifier") === v} onChange={() => X.setFiche(code, { cause: v })} style={{ accentColor: C.navy }} />
              {v === "confirmée" ? "cause confirmée" : "à vérifier"}
            </label>
          ))}
          <label className="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" checked={!!fi.actionDecided} onChange={set("actionDecided")} style={{ accentColor: C.navy }} /> action décidée
          </label>
        </div>
        <p className="text-xs mt-1" style={{ color: C.muted }}>Saisir une action ne confirme pas la cause : les deux statuts sont indépendants.</p>

        <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mt-4">
          <FField label="Cible validée">{txt("target", "Ex. −30 % de durée")}</FField>
          <FField label="Tonnes bonnes nettes récupérables">
            <input type="text" inputMode="decimal" className={inputCls} style={{ borderColor: C.grid, background: lock.locked ? "#F4F5F7" : "#fff" }}
              disabled={lock.locked} value={lock.locked ? "" : fi.tonnes || ""} placeholder={lock.locked ? "Impact non validé" : "t / horizon"} onChange={set("tonnes")} />
          </FField>
          <FField label="Gain net en €/an">
            <input type="text" inputMode="decimal" className={inputCls} style={{ borderColor: C.grid, background: lock.locked ? "#F4F5F7" : "#fff" }}
              disabled={lock.locked} value={lock.locked ? "" : fi.gain || ""} placeholder={lock.locked ? "Impact non validé" : "€/an"} onChange={set("gain")} />
          </FField>
          <FField label="Niveau de confiance">{sel("confidence", ["faible", "moyen", "élevé"])}</FField>
        </div>
        {lock.locked && <p className="text-xs mt-2" style={{ color: "#9A4A06" }}>Verrou fermé : tonnes récupérables et gain net ne sont saisissables qu'après validation des données et des entrées économiques.</p>}
      </div>
    </Card>
  );
}

// ---- Cascade d'impact ----
function Cascade({ F, X, A, Q, lock }) {
  const need = (keys) => COLLECT_ITEMS.filter((i) => keys.includes(i.key) && !collectState(i, X, A, Q)).map((i) => i.label);
  const r = F.reference;
  const fiches = Object.values(X.store.fiches).filter((f) => f.cause === "confirmée" && filled(f.target)).length;
  const cards = [
    { n: 1, title: "Référence",
      formula: "Tonnes bonnes = heures planifiées × disponibilité × cadence brute × rendement qualité",
      body: <>Retraité, toutes recettes confondues : {nc(r.plannedH, (x) => nf0.format(x) + " h")} × {pctNc(r.availability)} × {nc(r.grossRate, (x) => nf2.format(x) + " t/h")} × {pctNc(r.yield)} = <b>{nc(r.goodT, tons)}</b> bonnes.</>,
      notes: ["Par recette et sur un horizon commun : recette absente des fichiers.", "Jamais la somme des tonnes mixing + extrusion + packing."],
      missing: need(["recipeRate", "horizon"]) },
    { n: 2, title: "Scénario",
      formula: "Gain incrémental = volume(scénario n) − volume(scénario n−1)",
      body: <>Ordre explicite : A, puis B (B1, B2, B3 sans chevauchement), puis C, puis D. {fiches} fiche{fiches > 1 ? "s" : ""} avec cause confirmée et cible.</>,
      notes: ["Ne jamais sommer plusieurs gains calculés chacun depuis la même référence."],
      missing: fiches === 0 ? ["Cibles validées par famille"] : [] },
    { n: 3, title: "Gain vendable",
      formula: "Ventes plafonnées = min(volume, demande servable, capacité aval) ; gain vendable = ventes plafonnées(scénario) − ventes plafonnées(référence)",
      body: <>Les gains locaux hors goulot ne deviennent pas automatiquement des ventes.</>,
      notes: ["La famine du conditionnement ne s'ajoute pas au gain extrusion."],
      missing: need(["demand", "mix", "downstreamCap", "stocks"]) },
    { n: 4, title: "Gain net",
      formula: "Gain net = Δ ventes × marge contributive + économies hors marge − coûts du plan",
      body: <>Pas de double compte matière, rebut, énergie ou coût d'arrêt déjà inclus dans la marge.</>,
      notes: ["Annualisation seulement avec calendrier et horizon explicites.", "Économies sans ventes supplémentaires : à évaluer à part, sur leurs propres entrées documentées."],
      missing: need(["margin", "planCosts", "calendar", "horizon"]) },
  ];
  return (
    <Card title="Cascade d'impact" sub="Le raisonnement et les formules ; aucun montant tant que les entrées ne sont pas renseignées et validées.">
      <div className="grid grid-cols-1 lg:grid-cols-[1fr_auto_1fr_auto_1fr_auto_1fr] gap-2 items-stretch">
        {cards.map((c, i) => (
          <React.Fragment key={c.n}>
            <div className="rounded-lg p-4 flex flex-col gap-2" style={{ border: `1px solid ${C.grid}`, background: "#fff" }}>
              <div className="flex items-center gap-2">
                <span className="num font-bold rounded w-7 h-7 flex items-center justify-center text-sm shrink-0" style={{ background: C.navy, color: "#fff" }}>{c.n}</span>
                <h3 className="font-semibold" style={{ color: C.navy }}>{c.title}</h3>
              </div>
              <div className="text-xs p-2 rounded" style={{ background: "#F4F5F7", color: C.ink, fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace" }}>{c.formula}</div>
              <p className="text-sm num">{c.body}</p>
              <ul className="text-xs space-y-1 list-disc pl-4" style={{ color: C.muted }}>{c.notes.map((x) => <li key={x}>{x}</li>)}</ul>

function useQuestions() {
  const [store, setStore] = useState(() => {
    try { const s = JSON.parse(localStorage.getItem(Q_STORE_KEY) || "null"); if (s && typeof s === "object") return s; } catch (e) { /* ignoré */ }
    return {};
  });
  useEffect(() => { try { localStorage.setItem(Q_STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignoré */ } }, [store]);
  const get = (id) => store[id] || { status: "open", fields: {} };
  const update = (id, patch) => setStore((s) => {
    const cur = s[id] || { status: "open", fields: {} };
    return { ...s, [id]: { ...cur, ...patch, fields: { ...cur.fields, ...(patch.fields || {}) }, updatedAt: new Date().toISOString() } };
  });
  return { get, update, open: Q_CARDS.filter((c) => get(c.id).status === "open").length, reset: () => setStore({}) };
}

const pts = (a, b) => nf2.format(Math.abs(a - b) * 100) + " pt";
const pct2 = (v) => (v === null || v === undefined ? "—" : nf2.format(v * 100) + " %");
const rangeTxt = (r, f) => (r.min === null ? "—" : r.min === r.max ? f(r.min) : `${f(r.min)} – ${f(r.max)}`);
const monthFr = (key) => MONTHS[Number(key.slice(5, 7)) - 1];

// Constats chiffrés, recalculés depuis les données à chaque chargement.
function findings(id, M, D, demand) {
  if (id === "capacity") {
    const st = Object.fromEntries(M.flow.stages.map((s) => [s.stage, s]));
    const perMonth = 365 / 12 / M.dates.length;
    const goodMonth = M.plant.good * perMonth, maxMonth = M.idealPlannedT * perMonth;
    const isExt = M.flow.bottleneck === "extrusion";
    const facts = [
      <>Le conditionnement est affamé <b>{pct(st.packing.starvedPct)}</b> du temps planifié.</>,
      <>L'extrusion n'est quasiment jamais bloquée (<b>{pct(st.extrusion.blockedPct)}</b>) ni affamée ({pct(st.extrusion.starvedPct)}).</>,
      <>Le mélange est bloqué par l'aval <b>{pct(st.mixing.blockedPct)}</b> du temps.</>,
      <>Production bonne actuelle de l'extrusion : <b>{tons(goodMonth)}/mois</b> ; plafond théorique à 100 % de TRS : {tons(maxMonth)}/mois.</>,
    ];
    const verdict = isExt
      ? "L'extrusion est le goulot : elle fixe la cadence de l'usine. Toute tonne de demande supplémentaire passe par elle."
      : `Le goulot calculé est ${STAGE_FR[M.flow.bottleneck] ? STAGE_FR[M.flow.bottleneck].toLowerCase() : "non identifié"} : revoir la question de capacité en conséquence.`;
    let gap = null;
    if (demand > 0) {
      const d = demand - goodMonth;
      gap = d > 0
        ? <>Demande saisie : {tons(demand)}/mois, soit <b style={{ color: C.accent }}>{tons(d)}/mois de plus</b> que la production actuelle ({pct(K.safeDiv(d, goodMonth))}){demand > maxMonth ? ", au-delà même du plafond théorique : capacité supplémentaire nécessaire" : ", atteignable en améliorant le TRS"}.</>
        : <>Demande saisie : {tons(demand)}/mois, couverte par la production actuelle (marge de {tons(-d)}/mois) : le sujet est alors le service, pas la capacité.</>;
    }
    return { facts, verdict, gap,
      questions: ["Quelle est la demande réelle (carnet de commandes, prévisions) pour dimensionner la capacité extrusion ?",
        "La demande est-elle saisonnière ? Les petites séries des deux clients retail vont-elles augmenter ?"] };
  }
  if (id === "changeover") {
    const r = D.minPerCoRange, avg = K.safeDiv(D.plant.coMin, D.plant.co) || 0;
    const spread = Math.max(r.machines.max - r.machines.min, r.shifts.max - r.shifts.min);
    const homogeneous = avg > 0 && spread / avg < 0.1;
    const first = D.coPerDay[0], last = D.coPerDay[D.coPerDay.length - 1];
    const fmtMin = (v) => nf0.format(v) + " min";
    return {
      facts: [
        <><b>{nf0.format(D.plant.co)}</b> changements sur la période, <b>{mins(D.plant.coMin)}</b>, soit <b>{pct(D.plant.coShare)}</b> du temps planifié.</>,
        <>Durée moyenne : <b>{mins(avg)}</b> par changement ; par ligne {rangeTxt(r.machines, fmtMin)}, par équipe {rangeTxt(r.shifts, fmtMin)}.</>,
        first && last && first !== last && <>Fréquence : {nf1.format(first.perDay)} changements/jour en {monthFr(first.key)} → <b>{nf1.format(last.perDay)}</b> en {monthFr(last.key)}.</>,
      ].filter(Boolean),
      verdict: homogeneous
        ? "Durée quasi identique sur toutes les lignes et toutes les équipes : ce n'est pas un problème de compétences des opérateurs, mais de méthode de changement."
        : `Écart de ${fmtMin(spread)} entre lignes ou équipes : comparer les pratiques des meilleures et des moins bonnes.`,
      questions: ["Pourquoi environ " + fmtMin(avg) + " par changement ?", "Quelles sont les étapes du changement (arrêt, purge, nettoyage, redémarrage aux spécifications) ?",
        "Quelle est la politique de tailles de lots, et a-t-elle changé avec les clients retail ?"] };
  }
  const R = D.scrapRange, o = D.scrapOutlier;
  const spreadOk = (x) => x.min !== null && x.max - x.min < 0.005;
  const uniform = spreadOk(R.machines) && spreadOk(R.shifts) && spreadOk(R.months);
  const coGap = D.scrapWithCo !== null && D.scrapWithoutCo !== null ? D.scrapWithCo - D.scrapWithoutCo : null;
  return {
    facts: [
      <>Taux de rebut global : <b>{pct2(D.plant.scrapRate)}</b> ({tons(D.plant.scrap)}).</>,
      <>Par ligne{o ? ` (hors ${o.key})` : ""} : {rangeTxt(R.machines, pct2)} ; par équipe : {rangeTxt(R.shifts, pct2)} ; par mois : {rangeTxt(R.months, pct2)}.</>,
      o && <>Exception : <b style={{ color: C.accent }}>{o.key} à {pct2(o.scrapRate)}</b>, {pts(o.scrapRate, D.scrapMedian)} au-dessus de la médiane des lignes.</>,
      coGap !== null && <>Rebut des shifts avec changement : <b>{pct2(D.scrapWithCo)}</b> ; sans changement : <b>{pct2(D.scrapWithoutCo)}</b>.</>,
    ].filter(Boolean),
    verdict: [
      uniform ? "Rebut uniforme sur lignes, équipes et mois : cause systémique (matière, recette, réglages standards)." : "Rebut variable selon les lignes, équipes ou mois : chercher les segments les plus touchés.",
      o ? `${o.key} se détache : problème propre à la machine.` : null,
      coGap !== null && Math.abs(coGap) < 0.005 ? "Le rebut n'est pas lié aux changements de série." : coGap !== null ? `Écart de ${pts(D.scrapWithCo, D.scrapWithoutCo)} selon la présence d'un changement : à investiguer.` : null,
    ].filter(Boolean).join(" "),
    questions: ["Quelle matière, recette ou quel réglage peut expliquer un rebut systémique de l'ordre de " + pct2(D.plant.scrapRate) + " ?",
      o ? `Quel est l'historique de maintenance de ${o.key} ?` : "Une ligne présente-t-elle un historique de maintenance particulier ?"],
  };
}

// ---------- Notes sur les données ----------
function DataNotes({ M }) {
  const c = M.clean;
  const notes = [];
  if (c.duplicates.length) notes.push(`${c.duplicates.length} lignes en double exact (${[...new Set(c.duplicates.map((r) => dLong(r.date) + ", équipe " + r.shift))].join(" ; ")}) : supprimées.`);
  if (c.kgRows.length) notes.push(`${c.kgRows.length} relevés saisis en kg au lieu de tonnes (${c.kgRows.map((r) => `${r.machine} ${dShort(r.date)} ${r.shift} : ${nf0.format(r.raw)}`).join(" ; ")}) : divisés par 1 000. Le total recoupe alors le tonnage d'extrusion du flux.`);
  if (M.missing.length) notes.push(`Équipe absente du journal : ${M.missing.map((m) => `${dLong(m.date)}, équipe ${m.shift}`).join(" ; ")}. Le flux journalier montre aussi un temps planifié réduit ce jour-là : traité comme un shift non planifié, pas une donnée perdue.`);
  if (c.zeroPlanned.length) notes.push(`${c.zeroPlanned.length} relevés à 0 min planifiée (${[...new Set(c.zeroPlanned.map((r) => r.machine + " le " + dLong(r.date)))].join(" ; ")}) : ligne non planifiée, sans effet sur les sommes ; ratios protégés contre la division par zéro.`);
  if (c.overStop.length) notes.push(`Arrêts déclarés supérieurs au temps planifié : ${c.overStop.map((r) => `${r.machine} ${dShort(r.date)} ${r.shift} (${r.stops} min pour ${r.planned})`).join(" ; ")}. run_min = 0 conservé tel quel.`);
  return (
    <Card title="Notes sur les données" sub="Anomalies détectées dans les fichiers sources et traitement appliqué (à confirmer avec le site)">
      <ul className="list-disc pl-5 space-y-1.5 text-sm">
        {notes.map((n, i) => <li key={i}>{n}</li>)}
        <li>Cadence nominale identique pour les 7 lignes (2,3 t/h) : la performance compare chaque ligne à cette même référence.</li>
      </ul>
    </Card>
  );
}

// ---------- Application ----------
const TABS = [["overview", "Vue d'ensemble"], ["lines", "Lignes"], ["flow", "Flow"], ["problems", "Problèmes & impact"], ["questions", "Questions usine"]];

function App() {
  const [state, setState] = useState({ status: "loading" });
  const [tab, setTab] = useState("overview");
  const A = useAssumptions();
  const Q = useQuestions();
  const M0 = state.M;
  const E = useMemo(() => (M0 ? { values: A.values, impacts: K.impacts(M0.rows, M0.stageRows, A.lib) } : null),
    [M0, JSON.stringify(A.lib)]);
  useEffect(() => {
    Promise.all(["./extrusion_shift_log.csv", "./stage_daily.csv"].map((u) =>
      fetch(u).then((r) => { if (!r.ok) throw new Error(`${u} : HTTP ${r.status}`); return r.text(); })))
      .then(([a, b]) => setState({ status: "ok", M: buildModel(K.parseCSV(a), K.parseCSV(b)) }))
      .catch((e) => setState({ status: "error", error: e.message }));
  }, []);

  if (state.status === "loading") return <div className="p-12 text-center" style={{ color: C.muted }}>Chargement des données de production…</div>;
  if (state.status === "error") return (
    <div className="max-w-xl mx-auto mt-16 card p-6">
      <h1 className="text-lg font-semibold" style={{ color: C.accent }}>Impossible de charger les données</h1>
      <p className="mt-2 text-sm">{state.error}</p>
      <p className="mt-2 text-sm" style={{ color: C.muted }}>Les fichiers CSV doivent être servis à côté de index.html (ouvrir via un serveur, pas en file://).</p>
    </div>
  );
  const M = state.M;
  return (
    <div>
      <header style={{ background: C.navy }} className="text-white">
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 className="text-2xl sm:text-3xl font-semibold tracking-tight">Polymex — Cockpit usine</h1>
            <div className="text-sm opacity-80">Période : {dLong(M.dates[0])} – {dLong(M.dates[M.dates.length - 1])} · {M.dates.length} jours · 7 lignes d'extrusion · 3 équipes</div>
          </div>
          <nav className="flex flex-wrap items-center gap-1">
            {A.pending > 0 && (
              <button onClick={() => setTab("problems")} className="mr-2 text-xs font-semibold px-2 py-1 rounded"
                style={{ background: "#FDEBDD", color: "#9A4A06" }}>{A.pending} donnée{A.pending > 1 ? "s" : ""} à confirmer avec l'usine</button>
            )}
            {TABS.map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)} className="px-4 py-2 rounded-t text-base font-semibold"
                style={tab === k ? { background: "#F4F5F7", color: C.navy } : { color: "#fff", opacity: 0.85 }}>
                {l}
                {k === "questions" && Q.open > 0 && (
                  <span className="ml-1.5 text-xs font-bold px-1.5 py-0.5 rounded" style={{ background: C.accent, color: "#fff" }}>{Q.open}</span>
                )}
              </button>
            ))}
          </nav>
        </div>
      </header>
      <main className="max-w-[1400px] mx-auto px-4 sm:px-6 py-6">
        {tab === "overview" && <Overview M={M} E={E} go={setTab} />}
        {tab === "lines" && <Lines_ M={M} E={E} />}
        {tab === "flow" && <Flow M={M} E={E} />}
        {tab === "problems" && <Problems M={M} A={A} Q={Q} />}
        {tab === "questions" && <Questions M={M} Q={Q} />}
      </main>
      <footer className="max-w-[1400px] mx-auto px-4 sm:px-6 pb-8 text-xs" style={{ color: C.muted }}>
        Indicateurs calculés dans le navigateur à partir de extrusion_shift_log.csv et stage_daily.csv. TRS = disponibilité × performance × qualité, agrégés par sommes.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
