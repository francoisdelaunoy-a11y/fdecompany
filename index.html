<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Polymex — Cockpit usine</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4/dist/index.global.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<style>
  :root { --navy:#172B4D; --navy-2:#2D4A7A; --navy-3:#8FA3C4; --accent:#E8710A; --ok:#1F7A4D; --ink:#1E2530; --muted:#5E6C84; --line:#DFE3EA; --bg:#F4F5F7; }
  body { background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div id="root">
  <div style="padding:48px;text-align:center;color:#5E6C84">Chargement du cockpit…</div>
</div>

<!--
  Bibliothèque KPI : JavaScript pur (pas de JSX) pour pouvoir être testée par node
  (voir tests/kpi.test.js, qui extrait ce bloc). Toutes les agrégations se font par
  sommes, jamais par moyenne de ratios.
-->
<script id="kpi-lib">
(function (root) {
  var STAGES = ["mixing", "extrusion", "packing"];
  // Au-delà de ce tonnage, une ligne de 2,3 t/h sur 8 h (≈ 18 t max) a forcément été saisie en kg.
  var KG_THRESHOLD_T = 100;

  function safeDiv(a, b) { return b > 0 ? a / b : null; }

  function parseCSV(text) {
    var lines = text.replace(/\r/g, "").split("\n").filter(function (l) { return l.trim() !== ""; });
    if (!lines.length) return [];
    var head = lines[0].split(",").map(function (h) { return h.trim(); });
    return lines.slice(1).map(function (l) {
      var cells = l.split(","), row = {};
      head.forEach(function (h, i) {
        var v = (cells[i] || "").trim();
        row[h] = v !== "" && !isNaN(Number(v)) && h !== "date" ? Number(v) : v;
      });
      return row;
    });
  }

  // Nettoyage du journal d'extrusion. Renvoie les lignes propres et la liste des corrections appliquées.
  function cleanShiftLog(rows) {
    var seen = {}, out = [], dups = [], kg = [], zero = [], overStop = [];
    rows.forEach(function (r) {
      var key = JSON.stringify(r);
      if (seen[key]) { dups.push(r); return; }
      seen[key] = true;
      var c = Object.assign({}, r);
      if (c.output_t > KG_THRESHOLD_T) {
        kg.push({ date: c.date, shift: c.shift, machine: c.machine, raw: c.output_t });
        c.output_t = c.output_t / 1000; c.scrap_t = c.scrap_t / 1000;
      }
      if (c.planned_min === 0) zero.push(c);
      var stops = c.changeover_min + c.unplanned_downtime_min + c.other_stop_min;
      if (stops > c.planned_min) overStop.push({ date: c.date, shift: c.shift, machine: c.machine, stops: stops, planned: c.planned_min });
      out.push(c);
    });
    return { rows: out, duplicates: dups, kgRows: kg, zeroPlanned: zero, overStop: overStop };
  }

  // Combinaisons date × shift absentes du journal.
  function missingShifts(rows) {
    var have = {}, dates = {};
    rows.forEach(function (r) { have[r.date + "|" + r.shift] = true; dates[r.date] = true; });
    var out = [];
    Object.keys(dates).sort().forEach(function (d) {
      ["A", "B", "C"].forEach(function (s) { if (!have[d + "|" + s]) out.push({ date: d, shift: s }); });
    });
    return out;
  }

  // TRS = disponibilité × performance × qualité, chaque terme agrégé par sommes.
  function oee(rows) {
    var t = { planned: 0, run: 0, output: 0, scrap: 0, ideal: 0, down: 0, other: 0, co: 0, coMin: 0, n: rows.length };
    rows.forEach(function (r) {
      t.planned += r.planned_min; t.run += r.run_min; t.output += r.output_t; t.scrap += r.scrap_t;
      t.ideal += r.run_min / 60 * r.ideal_rate_tph;
      t.down += r.unplanned_downtime_min; t.other += r.other_stop_min;
      t.co += r.changeovers; t.coMin += r.changeover_min;
    });
    var a = safeDiv(t.run, t.planned), p = safeDiv(t.output, t.ideal);
    var q = t.output > 0 ? 1 - t.scrap / t.output : null;
    return Object.assign(t, {
      availability: a, performance: p, quality: q,
      oee: a === null || p === null || q === null ? null : a * p * q,
      good: t.output - t.scrap, scrapRate: safeDiv(t.scrap, t.output),
      coShare: safeDiv(t.coMin, t.planned)
    });
  }

  function groupBy(rows, fn) {
    var m = {};
    rows.forEach(function (r) { var k = fn(r); (m[k] = m[k] || []).push(r); });
    return m;
  }

  // Lundi de la semaine (ISO) d'une date AAAA-MM-JJ.
  function weekStart(iso) {
    var d = new Date(iso + "T00:00:00Z"), day = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - day);
    return d.toISOString().slice(0, 10);
  }

  // Taux starved / blocked par étape (en part des planned_min de l'étape) et identification du goulot.
  function flow(stageRows) {
    var by = groupBy(stageRows, function (r) { return r.stage; });
    var stages = STAGES.map(function (s) {
      var rows = by[s] || [], P = 0, st = 0, bl = 0, out = 0;
      rows.forEach(function (r) { P += r.planned_min; st += r.starved_min; bl += r.blocked_min; out += r.output_t; });
      return { stage: s, planned: P, starved: st, blocked: bl, output: out,
        starvedPct: safeDiv(st, P), blockedPct: safeDiv(bl, P), idlePct: safeDiv(st + bl, P) };
    });
    // Le goulot est l'étape qui attend le moins (ni affamée ni bloquée) : l'amont s'y bloque, l'aval y est affamé.
    var bottleneck = stages.reduce(function (best, s) {
      return s.idlePct !== null && (best === null || s.idlePct < best.idlePct) ? s : best;
    }, null);
    return { stages: stages, bottleneck: bottleneck ? bottleneck.stage : null };
  }

  // Impact économique des quatre problèmes, sur la période puis annualisé.
  // p : { margin €/t, downtimeCost €/h, smedPct, worstDownPct, bottleneckPct, scrapTarget (fractions 0-1) }.
  // Une minute perdue en extrusion vaut le débit réel de tonnes bonnes par heure de marche
  // (= cadence nominale × performance × qualité), de la ligne ou de l'usine.
  function impacts(rows, stageRows, p) {
    var plant = oee(rows);
    var days = Object.keys(groupBy(rows, function (r) { return r.date; })).length;
    var annual = safeDiv(365, days) || 0;
    var goodRate = function (o) { return safeDiv(o.good, o.run / 60) || 0; };
    var rate = goodRate(plant);
    var tOf = function (min, r) { return min / 60 * r; };

    var lines = Object.keys(groupBy(rows, function (r) { return r.machine; })).sort().map(function (m) {
      var o = oee(rows.filter(function (r) { return r.machine === m; }));
      o.machine = m; o.rate = goodRate(o); return o;
    });
    var worst = lines.reduce(function (a, b) { return b.down > a.down ? b : a; }, lines[0] || null);
    var others = lines.filter(function (l) { return l !== worst; });
    var othersAvgDown = safeDiv(others.reduce(function (s, l) { return s + l.down; }, 0), others.length) || 0;

    // 1. Pannes : toutes lignes ; levier = maintenance ciblée sur la pire ligne.
    var downT = tOf(plant.down, rate);
    var wRate = worst && worst.rate > 0 ? worst.rate : rate;
    var downGainMin = worst ? worst.down * p.worstDownPct : 0;
    var downGainT = tOf(downGainMin, wRate);
    var down = { id: "downtime", minutes: plant.down, tonnes: downT,
      cost: downT * p.margin + plant.down / 60 * p.downtimeCost,
      worst: worst, othersAvgDown: othersAvgDown, alignPct: worst && worst.down > 0 ? Math.max(0, 1 - othersAvgDown / worst.down) : 0,
      gainMin: downGainMin, gainT: downGainT * annual,
      gainEur: (downGainT * p.margin + downGainMin / 60 * p.downtimeCost) * annual };

    // 2. Changements de série : levier SMED (réduction du temps de changement).
    var coT = tOf(plant.coMin, rate);
    var co = { id: "changeover", minutes: plant.coMin, count: plant.co, tonnes: coT, cost: coT * p.margin,
      avgMin: safeDiv(plant.coMin, plant.co),
      gainMin: plant.coMin * p.smedPct, gainT: coT * p.smedPct * annual, gainEur: coT * p.smedPct * p.margin * annual };

    // 3. Rebut : levier plan qualité (ramener le taux de rebut à la cible).
    var scrapRate = plant.scrapRate || 0;
    var scrapGainT = Math.max(0, plant.output * (scrapRate - p.scrapTarget));
    var scrap = { id: "scrap", tonnes: plant.scrap, rate: scrapRate, output: plant.output, cost: plant.scrap * p.margin,
      gainT: scrapGainT * annual, gainEur: scrapGainT * p.margin * annual };

    // 4. Goulot : capacité amont bloquée par le goulot, valorisée au débit de l'étape amont.
    var f = flow(stageRows), idx = STAGES.indexOf(f.bottleneck);
    var src = idx > 0 ? f.stages[idx - 1] : f.stages[idx + 1];
    var lostMin = src ? (idx > 0 ? src.blocked : src.starved) : 0;
    var srcRun = src ? src.planned - src.starved - src.blocked : 0;
    var srcRate = src ? safeDiv(src.output, srcRun) || 0 : 0; // t par minute-unité de marche
    var bnT = lostMin * srcRate;
    var bn = { id: "bottleneck", stage: f.bottleneck, source: src ? src.stage : null, sourceKind: idx > 0 ? "blocked" : "starved",
      minutes: lostMin, ratePerUnitHour: srcRate * 60, tonnes: bnT, cost: bnT * p.margin,
      gainT: bnT * p.bottleneckPct * annual, gainEur: bnT * p.bottleneckPct * p.margin * annual };

    var problems = [bn, down, co, scrap].sort(function (a, b) { return b.cost - a.cost; });
    return { days: days, annual: annual, rate: rate, plant: plant, problems: problems,
      // Le goulot recoupe pannes et changements (ce sont eux qui limitent l'extrusion) : il n'est pas additionné.
      internalGainEur: down.gainEur + co.gainEur + scrap.gainEur,
      internalGainT: down.gainT + co.gainT + scrap.gainT };
  }

  root.PolymexKPI = { safeDiv: safeDiv, parseCSV: parseCSV, cleanShiftLog: cleanShiftLog, missingShifts: missingShifts,
    oee: oee, groupBy: groupBy, weekStart: weekStart, flow: flow, impacts: impacts, STAGES: STAGES };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const K = window.PolymexKPI;

const C = { navy: "#172B4D", navy2: "#2D4A7A", navy3: "#8FA3C4", accent: "#E8710A", ok: "#1F7A4D", muted: "#5E6C84", grid: "#E6E9EF" };
const STAGE_FR = { mixing: "Mélange", extrusion: "Extrusion", packing: "Conditionnement" };
const STAGE_THE = { mixing: "Le mélange", extrusion: "L'extrusion", packing: "Le conditionnement" };
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

const nf1 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (v === null || v === undefined ? "—" : nf1.format(v * 100) + " %");
const tons = (v) => (v === null || v === undefined ? "—" : nf1.format(v) + " t");
const mins = (v) => (v === null || v === undefined ? "—" : nf0.format(v) + " min");
const hours = (m) => nf0.format(m / 60) + " h";
const dShort = (iso) => { const [, m, d] = iso.split("-"); return `${Number(d)} ${MONTHS[Number(m) - 1]}`; };
const dLong = (iso) => { const [y, m, d] = iso.split("-"); return `${Number(d)} ${MONTHS[Number(m) - 1]} ${y}`; };

// ---------- Calculs ----------
function buildModel(shiftRaw, stageRaw) {
  const clean = K.cleanShiftLog(shiftRaw);
  const rows = clean.rows;
  const dates = [...new Set(rows.map((r) => r.date))].sort();
  const plant = K.oee(rows);

  const machines = Object.entries(K.groupBy(rows, (r) => r.machine))
    .map(([m, rs]) => ({ machine: m, ...K.oee(rs), rows: rs }))
    .sort((a, b) => a.machine.localeCompare(b.machine));

  const shifts = ["A", "B", "C"].map((s) => ({ shift: s, ...K.oee(rows.filter((r) => r.shift === s)) }));

  const weekly = (rs) => Object.entries(K.groupBy(rs, (r) => K.weekStart(r.date)))
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([w, wr]) => ({ week: w, days: new Set(wr.map((r) => r.date)).size, ...K.oee(wr) }));

  const stageClean = stageRaw;
  const flow = K.flow(stageClean);
  const stageWeekly = Object.entries(K.groupBy(stageClean, (r) => K.weekStart(r.date)))
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([w, wr]) => {
      const f = K.flow(wr);
      const o = { week: w };
      f.stages.forEach((s) => { o[s.stage] = s; });
      return o;
    });

  return {
    clean, rows, dates, plant, machines, shifts, stageRows: stageClean,
    idealPlannedT: rows.reduce((s, r) => s + r.planned_min / 60 * r.ideal_rate_tph, 0),
    weeks: weekly(rows), weeklyOf: (m) => weekly(rows.filter((r) => r.machine === m)),
    missing: K.missingShifts(rows), flow, stageWeekly,
    stageOutput: Object.fromEntries(flow.stages.map((s) => [s.stage, s.output])),
  };
}

// ---------- Graphiques SVG ----------
function useHover() { const [h, setH] = useState(null); return [h, setH]; }

// Maximum d'axe « rond » (4 graduations de pas 1, 2, 2,5 ou 5 × 10^n).
function niceMax(v) {
  if (!(v > 0)) return 1;
  const raw = v / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((k) => k >= raw);
  return step * 4;
}

// Barres verticales sur une catégorie temporelle.
function Bars({ data, value, label, fmt, height = 200, width = 720, color = C.navy, highlight, yMax, refLine }) {
  const [h, setH] = useHover();
  const W = width, H = height, pl = 52, pr = 12, pt = 16, pb = 30;
  const max = yMax || niceMax(Math.max(...data.map(value).filter((v) => v !== null), 0));
  const bw = (W - pl - pr) / data.length;
  const y = (v) => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => t * max);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img">
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={pl} x2={W - pr} y1={y(t)} y2={y(t)} stroke={C.grid} />
          <text x={pl - 6} y={y(t) + 4} textAnchor="end" fontSize="11" fill={C.muted}>{fmt.axis(t)}</text>
        </g>
      ))}
      {refLine !== undefined && (
        <g>
          <line x1={pl} x2={W - pr} y1={y(refLine.v)} y2={y(refLine.v)} stroke={C.muted} strokeDasharray="4 3" />
          <text x={W - pr} y={y(refLine.v) - 4} textAnchor="end" fontSize="11" fill={C.muted}>{refLine.label}</text>
        </g>
      )}
      {data.map((d, i) => {
        const v = value(d);
        if (v === null) return null;
        const x = pl + i * bw + bw * 0.15, top = y(v);
        const fill = highlight && highlight(d) ? C.accent : color;
        return (
          <g key={i} onMouseEnter={() => setH(i)} onMouseLeave={() => setH(null)}>
            <rect x={pl + i * bw} y={pt} width={bw} height={H - pt - pb} fill="transparent" />
            <rect x={x} y={top} width={bw * 0.7} height={Math.max(0, y(0) - top)} rx="2" fill={fill} opacity={h === null || h === i ? 1 : 0.55} />
            {(i % Math.ceil(data.length / 13) === 0) && (
              <text x={x + bw * 0.35} y={H - 10} textAnchor="middle" fontSize="11" fill={C.muted}>{label(d)}</text>
            )}
          </g>
        );
      })}
      {h !== null && value(data[h]) !== null && (() => {
        const x = Math.min(Math.max(pl + h * bw + bw / 2, pl + 70), W - pr - 70), top = y(value(data[h]));
        return (
          <g pointerEvents="none">
            <rect x={x - 70} y={Math.max(0, top - 30)} width="140" height="22" rx="4" fill={C.navy} />
            <text x={x} y={Math.max(0, top - 30) + 15} textAnchor="middle" fontSize="12" fill="#fff">{label(data[h])} · {fmt.tip(value(data[h]))}</text>
          </g>
        );
      })()}
    </svg>
  );
}

// Courbes multiples sur une catégorie temporelle.
function Lines({ data, series, label, fmt, height = 220, width = 720, yMax, yMin = 0 }) {
  const [h, setH] = useHover();
  const W = width, H = height, pl = 52, pr = 12, pt = 16, pb = 30;
  const all = data.flatMap((d) => series.map((s) => s.value(d))).filter((v) => v !== null);
  const max = yMax || niceMax(Math.max(...all));
  const step = (W - pl - pr) / Math.max(1, data.length - 1);
  const xs = (i) => pl + i * step;
  const y = (v) => pt + (H - pt - pb) * (1 - (v - yMin) / (max - yMin));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => yMin + t * (max - yMin));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img"
      onMouseLeave={() => setH(null)}
      onMouseMove={(e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const px = ((e.clientX - r.left) / r.width) * W;
        setH(Math.min(data.length - 1, Math.max(0, Math.round((px - pl) / step))));
      }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={pl} x2={W - pr} y1={y(t)} y2={y(t)} stroke={C.grid} />
          <text x={pl - 6} y={y(t) + 4} textAnchor="end" fontSize="11" fill={C.muted}>{fmt.axis(t)}</text>
        </g>
      ))}
      {data.map((d, i) => (i % Math.ceil(data.length / 13) === 0) && (
        <text key={i} x={xs(i)} y={H - 10} textAnchor="middle" fontSize="11" fill={C.muted}>{label(d)}</text>
      ))}
      {series.map((s) => {
        const pts = data.map((d, i) => [xs(i), s.value(d)]).filter(([, v]) => v !== null);
        return (
          <g key={s.name}>
            <polyline fill="none" stroke={s.color} strokeWidth="2.5" strokeLinejoin="round" points={pts.map(([x, v]) => `${x},${y(v)}`).join(" ")} />
            {pts.map(([x, v], i) => <circle key={i} cx={x} cy={y(v)} r="3" fill={s.color} />)}
          </g>
        );
      })}
      {h !== null && (() => {
        const x = xs(h), bx = Math.min(Math.max(x + 8, pl), W - pr - 190);
        return (
          <g pointerEvents="none">
            <line x1={x} x2={x} y1={pt} y2={H - pb} stroke={C.muted} strokeDasharray="3 3" />
            <rect x={bx} y={pt} width="190" height={22 + series.length * 18} rx="4" fill={C.navy} />
            <text x={bx + 10} y={pt + 16} fontSize="12" fill="#fff" fontWeight="600">{label(data[h])}</text>
            {series.map((s, i) => (
              <text key={s.name} x={bx + 10} y={pt + 34 + i * 18} fontSize="12" fill="#fff">
                <tspan fill={s.color === C.navy ? "#9FB3D9" : s.color}>■ </tspan>{s.name} : {fmt.tip(s.value(data[h]))}
              </text>
            ))}
          </g>
        );
      })()}
    </svg>
  );
}

// Barre horizontale simple (classement, part d'un tout).
function HBar({ v, max = 1, color = C.navy, h = 10 }) {
  const w = v === null ? 0 : Math.max(0, Math.min(1, v / max)) * 100;
  return (
    <div className="w-full rounded-sm" style={{ background: C.grid, height: h }}>
      <div className="rounded-sm" style={{ width: `${w}%`, background: color, height: h }} />
    </div>
  );
}

function Legend({ items }) {
  return (
    <div className="flex flex-wrap gap-4 text-sm" style={{ color: C.muted }}>
      {items.map((i) => (
        <span key={i.name} className="flex items-center gap-1.5">
          <span style={{ width: 12, height: 3, background: i.color, display: "inline-block" }} />{i.name}
        </span>
      ))}
    </div>
  );
}

// ---------- Mise en page ----------
function Card({ title, sub, children, className = "" }) {
  return (
    <section className={`card p-5 ${className}`}>
      {title && <h2 className="text-lg font-semibold" style={{ color: C.navy }}>{title}</h2>}
      {sub && <p className="text-sm mt-0.5 mb-3" style={{ color: C.muted }}>{sub}</p>}
      {!sub && title && <div className="mb-3" />}
      {children}
    </section>
  );
}

function Kpi({ label, value, note, alert }) {
  return (
    <div className="card p-5" style={alert ? { borderTop: `4px solid ${C.accent}` } : { borderTop: `4px solid ${C.navy}` }}>
      <div className="text-sm font-medium uppercase tracking-wide" style={{ color: C.muted }}>{label}</div>
      <div className="num text-4xl font-semibold mt-2" style={{ color: C.navy }}>{value}</div>
      {note && <div className="text-sm mt-1" style={{ color: C.muted }}>{note}</div>}
    </div>
  );
}

const fmtPct = { axis: (v) => nf0.format(v * 100) + " %", tip: pct };
const fmtT = { axis: (v) => nf0.format(v) + " t", tip: tons };
const fmtN = { axis: (v) => nf0.format(v), tip: (v) => nf0.format(v) };

// ---------- Onglet 1 : vue d'ensemble ----------
function Overview({ M, E, go }) {
  const ranked = [...M.machines].sort((a, b) => b.oee - a.oee);

// ---------- Onglet 3 : flow ----------
function Flow({ M, E }) {
  const { stages, bottleneck } = M.flow;
  const ext = stages.find((s) => s.stage === "extrusion");
  const mix = stages.find((s) => s.stage === "mixing");
  const pack = stages.find((s) => s.stage === "packing");
  const maxPct = Math.max(...stages.flatMap((s) => [s.starvedPct, s.blockedPct]));
  return (
    <div className="space-y-5">
      <Card title="Flux mélange → extrusion → conditionnement" sub="Minutes-unités en attente, en part du temps planifié de chaque étape (7 unités par étape)">
        <div className="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr_auto_1fr] gap-3 items-stretch">
          {stages.map((s, i) => {
            const isB = s.stage === bottleneck;
            return (
              <React.Fragment key={s.stage}>
                <div className="rounded-lg p-5" style={{ border: `2px solid ${isB ? C.accent : C.grid}`, background: isB ? "#FFF6EE" : "#fff" }}>
                  <div className="flex justify-between items-center">
                    <span className="text-xl font-semibold" style={{ color: C.navy }}>{STAGE_FR[s.stage]}</span>
                    {isB && <span className="text-xs font-bold uppercase px-2 py-1 rounded" style={{ background: C.accent, color: "#fff" }}>Goulot</span>}
                  </div>
                  <div className="num text-sm mt-1" style={{ color: C.muted }}>{tons(s.output)} produites</div>
                  <div className="mt-4 space-y-3">
                    <div>
                      <div className="flex justify-between text-sm"><span>Affamée (attend l'amont)</span><span className="num font-semibold">{pct(s.starvedPct)}</span></div>
                      <HBar v={s.starvedPct} max={maxPct} color={C.navy3} />
                    </div>
                    <div>
                      <div className="flex justify-between text-sm"><span>Bloquée (l'aval sature)</span><span className="num font-semibold">{pct(s.blockedPct)}</span></div>
                      <HBar v={s.blockedPct} max={maxPct} color={C.navy} />
                    </div>
                  </div>
                </div>
                {i < stages.length - 1 && <div className="hidden md:flex items-center text-3xl" style={{ color: C.navy3 }}>→</div>}
              </React.Fragment>
            );
          })}
        </div>
        <div className="mt-5 p-4 rounded" style={{ background: "#F4F5F7", borderLeft: `4px solid ${C.accent}` }}>
          <p className="text-base" style={{ color: C.ink }}>
            <b style={{ color: C.navy }}>Le goulot est l'{STAGE_FR[bottleneck].toLowerCase()}.</b>{" "}
            Le mélange est bloqué {pct(mix.blockedPct)} du temps parce que l'extrusion n'absorbe pas son débit,
            et le conditionnement attend l'extrusion {pct(pack.starvedPct)} du temps. L'extrusion, elle, n'est presque jamais
            à l'arrêt pour cause de flux ({pct(ext.idlePct)}) : c'est elle qui fixe la cadence de l'usine.
            Chaque point de TRS gagné en extrusion (aujourd'hui {pct(M.plant.oee)}) vaut ≈ {tons(M.idealPlannedT * 0.01 * E.impacts.annual)} bonnes par an,
            soit <b style={{ color: C.navy }}>{eur(M.idealPlannedT * 0.01 * E.impacts.annual * E.values.margin)}/an</b> de marge.
          </p>
        </div>
      </Card>

      <Card title="Évolution hebdomadaire des attentes" sub="Signaux du goulot : blocage du mélange (amont) et famine du conditionnement (aval)">
        <Legend items={[
          { name: "Mélange bloqué", color: C.navy },
          { name: "Conditionnement affamé", color: C.accent },
          { name: "Extrusion affamée + bloquée", color: C.navy3 },
        ]} />
        <Lines data={M.stageWeekly}
          series={[
            { name: "Mélange bloqué", value: (d) => d.mixing.blockedPct, color: C.navy },
            { name: "Cond. affamé", value: (d) => d.packing.starvedPct, color: C.accent },

          ]}

  );

// Les pourcentages sont saisis en % dans l'interface et convertis en fractions pour kpi-lib.
// Prix de vente par défaut : chiffre d'affaires et tonnage annuels du brief (README).
const BRIEF_REVENUE_EUR = 148e6, BRIEF_TONNES = 86000;
const PARAMS = {
  margin: { label: "Marge sur coûts variables", unit: "€/t", def: 300, min: 0, max: 1000, step: 10 },
  downtimeCost: { label: "Coût direct d'une heure d'arrêt non planifié", unit: "€/h", def: 250, min: 0, max: 2000, step: 10,
    hint: "Hors marge perdue : intervention, pièces, main d'œuvre immobilisée." },
  smedPct: { label: "SMED : réduction du temps de changement", unit: "%", def: 30, min: 0, max: 80, step: 5, pct: true },
  worstDownPct: { label: "Maintenance : réduction des pannes de la pire ligne", unit: "%", def: 50, min: 0, max: 90, step: 5, pct: true },
  bottleneckPct: { label: "Capacité : part du blocage amont récupérée", unit: "%", def: 50, min: 0, max: 100, step: 5, pct: true },
  scrapTarget: { label: "Taux de rebut cible", unit: "%", def: 4, min: 0, max: 10, step: 0.5, pct: true },
  price: { label: "Prix de vente moyen", unit: "€/t", def: Math.round(BRIEF_REVENUE_EUR / BRIEF_TONNES),
    hint: "Défaut : 148 M€ de CA / 86 000 t par an (brief)." },
  operators: { label: "Opérateurs par ligne et par équipe", unit: "pers.", def: 2 },
  energyPrice: { label: "Coût de l'électricité", unit: "€/MWh", def: 150 },
  energyKwhT: { label: "Consommation électrique de l'extrusion", unit: "kWh/t", def: 350 },
};
const HYP_KEYS = ["margin", "downtimeCost", "smedPct", "worstDownPct", "bottleneckPct", "scrapTarget"];
const FIELD_CARDS = [
  { key: "margin", title: "Vraie marge par tonne", who: "Contrôle de gestion" },
  { key: "price", title: "Prix de vente moyen", who: "Direction commerciale" },
  { key: "downtimeCost", title: "Coût d'une heure de panne", who: "Responsable maintenance" },
  { key: "scrapTarget", title: "Taux de rebut cible", who: "Responsable qualité" },
  { key: "operators", title: "Effectifs en extrusion", who: "Responsable production" },
  { key: "energyPrice", title: "Prix de l'électricité", who: "Achats / services généraux" },
  { key: "energyKwhT", title: "Consommation par tonne", who: "Méthodes / énergie" },
];
const STORE_KEY = "polymex-cockpit-assumptions-v1";

function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (s && typeof s === "object") return { hyp: s.hyp || {}, field: s.field || {} };
  } catch (e) { /* stockage indisponible : on repart des valeurs par défaut */ }
  return { hyp: {}, field: {} };
}

// Valeur effective : saisie terrain > hypothèse réglée > défaut.
function useAssumptions() {
  const [store, setStore] = useState(loadStore);
  const [resetKey, setResetKey] = useState(0);
  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignoré */ } }, [store]);
  const values = {};
  Object.keys(PARAMS).forEach((k) => { values[k] = store.field[k] ?? store.hyp[k] ?? PARAMS[k].def; });
  const lib = {};
  Object.keys(PARAMS).forEach((k) => { lib[k] = PARAMS[k].pct ? values[k] / 100 : values[k]; });
  return {
    values, lib, store, resetKey,
    pending: FIELD_CARDS.filter((c) => store.field[c.key] === undefined).length,
    confirmed: (k) => store.field[k] !== undefined,
    setHyp: (k, v) => setStore((s) => ({ ...s, hyp: { ...s.hyp, [k]: v } })),
    setField: (k, v) => setStore((s) => {
      const field = { ...s.field };
      if (v === undefined) delete field[k]; else field[k] = v;
      return { ...s, field };
    }),
    reset: () => { setStore({ hyp: {}, field: {} }); setResetKey((n) => n + 1); },
  };
}

const eur = (v) => {
  if (v === null || v === undefined || !Number.isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e6) return nf1.format(v / 1e6) + " M€";
  if (a >= 1e4) return nf0.format(v / 1e3) + " k€";
  return nf0.format(v) + " €";
};
const fmtParam = (k, v) => (PARAMS[k].pct ? nf1.format(v) : nf0.format(v)) + " " + PARAMS[k].unit;

function Badge({ ok }) {
  return ok
    ? <span className="text-xs font-semibold px-2 py-0.5 rounded" style={{ background: "#E6F2EC", color: C.ok }}>Valeur terrain</span>
    : <span className="text-xs font-semibold px-2 py-0.5 rounded whitespace-nowrap" style={{ background: "#FDEBDD", color: "#9A4A06" }}>à confirmer avec l'usine</span>;
}

function AssumptionsPanel({ A }) {
  return (
    <section className="card p-5 xl:sticky xl:top-4">
      <h2 className="text-lg font-semibold" style={{ color: C.navy }}>Hypothèses de calcul</h2>
      <p className="text-sm mt-0.5 mb-4" style={{ color: C.muted }}>Tous les montants en € du cockpit se recalculent à chaque réglage.</p>
      <div className="space-y-5">
        {HYP_KEYS.map((k) => {
          const p = PARAMS[k], locked = A.confirmed(k);
          return (
            <div key={k}>
              <div className="flex justify-between items-baseline gap-2">
                <label htmlFor={`hyp-${k}`} className="text-sm font-medium">{p.label}</label>
                <span className="num font-semibold whitespace-nowrap" style={{ color: C.navy }}>{fmtParam(k, A.values[k])}</span>
              </div>
              <input id={`hyp-${k}`} type="range" className="w-full mt-1" style={{ accentColor: C.navy }}
                min={p.min} max={Math.max(p.max, A.values[k])} step={p.step} value={A.values[k]} disabled={locked}
                onChange={(e) => A.setHyp(k, Number(e.target.value))} />
              {locked
                ? <div className="text-xs" style={{ color: C.ok }}>Remplacé par la valeur terrain saisie plus bas.</div>
                : p.hint && <div className="text-xs" style={{ color: C.muted }}>{p.hint}</div>}
            </div>
          );
        })}
      </div>
      <div className="mt-5 pt-4 flex items-center justify-between gap-3" style={{ borderTop: `1px solid ${C.grid}` }}>
        <span className="text-xs" style={{ color: C.muted }}>Valeurs enregistrées dans ce navigateur.</span>
        <button className="text-sm font-semibold px-3 py-1.5 rounded border" style={{ color: C.navy, borderColor: C.grid }}
          onClick={() => { if (window.confirm("Réinitialiser toutes les hypothèses et valeurs terrain ?")) A.reset(); }}>
          Réinitialiser les valeurs
        </button>
      </div>
    </section>
  );
}

function FieldCard({ card, A }) {
  const p = PARAMS[card.key], saved = A.store.field[card.key];
  const [draft, setDraft] = useState(saved === undefined ? "" : String(saved).replace(".", ","));
  const [invalid, setInvalid] = useState(false);
  const onChange = (e) => {
    const raw = e.target.value;
    setDraft(raw);
    if (raw.trim() === "") { setInvalid(false); A.setField(card.key, undefined); return; }
    const n = Number(raw.replace(/\s/g, "").replace(",", "."));
    if (Number.isFinite(n) && n >= 0) { setInvalid(false); A.setField(card.key, n); } else setInvalid(true);
  };
  return (
    <div className="card p-4 flex flex-col gap-2" style={{ borderTop: `3px solid ${saved === undefined ? C.accent : C.ok}` }}>
      <div className="flex justify-between items-start gap-2">
        <span className="font-semibold" style={{ color: C.navy }}>{card.title}</span>
        {saved === undefined ? <Badge ok={false} /> : null}
      </div>
      <div className="text-xs" style={{ color: C.muted }}>À demander : {card.who}</div>
      <div className="flex items-center rounded border" style={{ borderColor: invalid ? C.accent : C.grid }}>
        <input type="text" inputMode="decimal" className="num w-full px-3 py-2 text-lg outline-none rounded" placeholder={nf0.format(p.def)}
          value={draft} onChange={onChange} aria-label={card.title} />
        <span className="px-3 text-sm" style={{ color: C.muted }}>{p.unit}</span>
      </div>
      <div className="text-xs" style={{ color: invalid ? C.accent : C.muted }}>
        {invalid ? "Nombre positif attendu." : saved === undefined ? `Valeur par défaut utilisée : ${fmtParam(card.key, p.def)}` : `Utilisée partout dans le cockpit.`}
      </div>
    </div>
  );
}

// ---------- Onglet 4 : problèmes et impact ----------
function ProblemCard({ rank, pb, E, M, maxCost }) {
  const v = E.values, I = E.impacts, rate = nf2.format(I.rate);
  let title, detail, method, lever, leverText, extra = null, note = null;
  if (pb.id === "bottleneck") {
    const srcPct = K.safeDiv(pb.minutes, M.flow.stages.find((s) => s.stage === pb.source)?.planned || 0);
    title = `Goulot du flux : ${pb.stage ? STAGE_FR[pb.stage].toLowerCase() : "non identifié"}`;
    detail = pb.sourceKind === "blocked"
      ? `${STAGE_THE[pb.source] || "L'amont"} est bloqué ${pct(srcPct)} de son temps faute de place en ${STAGE_FR[pb.stage]?.toLowerCase()} : capacité amont disponible mais non transformée.`
      : `${STAGE_THE[pb.source] || "L'aval"} attend ${pct(srcPct)} de son temps.`;
    method = `${nf0.format(pb.minutes)} min-unités de blocage (${(STAGE_FR[pb.source] || "").toLowerCase()}) ÷ 60 × ${nf2.format(pb.ratePerUnitHour)} t/h par unité en marche = ${tons(pb.tonnes)}`;
    lever = "Capacité au goulot";
    leverText = `Ajouter de la capacité d'extrusion (heures, débridage, 8e ligne) pour absorber ${nf0.format(v.bottleneckPct)} % du blocage amont. Gain à comparer au coût de l'investissement.`;
    note = "Recoupe les pannes et les changements de série, qui limitent eux-mêmes l'extrusion : non additionné au total.";
  } else if (pb.id === "downtime") {
    const w = pb.worst;
    title = "Pannes (arrêts non planifiés)";
    detail = w ? `${w.machine} cumule ${mins(w.down)} de pannes, ${nf1.format(K.safeDiv(w.down, pb.othersAvgDown) || 0)} fois la moyenne des autres lignes (${mins(pb.othersAvgDown)}). Soit ${nf0.format(pb.minutes / 60 * v.operators)} heures-opérateur immobilisées sur l'usine.` : "";
    method = `${nf0.format(pb.minutes)} min ÷ 60 × ${rate} t bonnes/h = ${tons(pb.tonnes)} ; coût = t × ${nf0.format(v.margin)} €/t + ${nf0.format(pb.minutes / 60)} h × ${nf0.format(v.downtimeCost)} €/h`;
    lever = `Maintenance ciblée sur ${w ? w.machine : "la pire ligne"}`;
    leverText = `Réduire de ${nf0.format(v.worstDownPct)} % les pannes de ${w ? w.machine : "la pire ligne"} (l'aligner sur la moyenne des autres lignes = −${nf0.format(pb.alignPct * 100)} %) : analyse des causes, préventif, pièces critiques.`;
    const max = Math.max(...M.machines.map((m) => m.down));
    extra = (
      <div className="grid grid-cols-7 gap-2 mt-3 items-end" style={{ height: 70 }}>
        {M.machines.map((m) => (
          <div key={m.machine} className="flex flex-col items-center justify-end h-full" title={`${m.machine} : ${mins(m.down)}`}>
            <div className="w-full rounded-sm" style={{ height: `${(K.safeDiv(m.down, max) || 0) * 48}px`, background: w && m.machine === w.machine ? C.accent : C.navy3 }} />
            <span className="text-xs mt-1" style={{ color: w && m.machine === w.machine ? C.accent : C.muted, fontWeight: w && m.machine === w.machine ? 700 : 400 }}>{m.machine}</span>
          </div>
        ))}
      </div>
    );
  } else if (pb.id === "changeover") {
    title = "Temps perdu en changements de série";
    detail = `${nf0.format(pb.count)} changements, ${mins(pb.avgMin)} en moyenne chacun, soit ${pct(M.plant.coShare)} du temps planifié.`;
    method = `${nf0.format(pb.minutes)} min ÷ 60 × ${rate} t bonnes/h = ${tons(pb.tonnes)}`;
    lever = "SMED";
    leverText = `Réduire de ${nf0.format(v.smedPct)} % la durée des changements : préparation hors arrêt, purges standardisées, séquençage des recettes.`;
  } else {
    const mwh = pb.tonnes * v.energyKwhT / 1000;
    title = "Rebut et retraitement";
    detail = `${pct(pb.rate)} de la production brute. Énergie consommée par le rebut : ${nf0.format(mwh)} MWh, soit ${eur(mwh * v.energyPrice)} sur la période.`;
    method = `Σ scrap_t = ${tons(pb.tonnes)} (rebut + retraité), valorisé à la marge`;
    lever = "Plan qualité";
    leverText = `Ramener le taux de rebut de ${pct(pb.rate)} à ${nf1.format(v.scrapTarget)} % : réglages au démarrage, contrôle matière, suivi par équipe.`;
    if (pb.gainT === 0) note = "Le taux actuel est déjà sous la cible : aucun gain avec cette hypothèse.";
  }
  return (
    <section className="card p-5">
      <div className="flex items-start justify-between gap-4">
        <div className="flex items-start gap-3 flex-1 min-w-0">
          <span className="num text-lg font-bold rounded w-9 h-9 flex items-center justify-center shrink-0"
            style={{ background: rank === 1 ? C.accent : C.navy, color: "#fff" }}>{rank}</span>
          <div>
            <h3 className="text-lg font-semibold" style={{ color: C.navy }}>{title}</h3>
            <p className="text-sm mt-0.5" style={{ color: C.ink }}>{detail}</p>
          </div>
        </div>
        <div className="text-right shrink-0">
          <div className="num text-3xl font-semibold whitespace-nowrap" style={{ color: C.navy }}>{tons(pb.tonnes)}</div>
          <div className="text-xs" style={{ color: C.muted }}>perdues sur {I.days} jours</div>
        </div>
      </div>
      <div className="mt-3"><HBar v={pb.cost} max={maxCost} color={rank === 1 ? C.accent : C.navy} h={8} /></div>
      <div className="num flex flex-wrap gap-x-6 gap-y-1 mt-2 text-sm">
        <span>Coût sur la période : <b>{eur(pb.cost)}</b></span>
        <span>Annualisé : <b>{eur(pb.cost * I.annual)}/an</b></span>
        <span style={{ color: C.muted }}>CA non réalisé : {eur(pb.tonnes * v.price)}</span>
      </div>
      <div className="num text-xs mt-2 px-3 py-2 rounded" style={{ background: "#F4F5F7", color: C.muted, fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace" }}>
        Méthode : {method}
      </div>
      {extra}
      <div className="mt-4 p-4 rounded flex flex-wrap justify-between gap-4" style={{ border: `1px solid ${C.grid}`, borderLeft: `4px solid ${C.ok}` }}>
        <div className="flex-1 min-w-[240px]">
          <div className="text-xs font-bold uppercase tracking-wide" style={{ color: C.ok }}>Levier : {lever}</div>
          <p className="text-sm mt-1">{leverText}</p>
        </div>
        <div className="text-right">
          <div className="num text-2xl font-semibold" style={{ color: C.ok }}>+{eur(pb.gainEur)}/an</div>
          <div className="num text-xs" style={{ color: C.muted }}>+{tons(pb.gainT)} bonnes par an</div>
        </div>
      </div>
      {note && <p className="text-xs mt-2" style={{ color: C.muted }}>{note}</p>}
    </section>
  );
}

function Problems({ M, E, A }) {
  const I = E.impacts, maxCost = Math.max(...I.problems.map((p) => p.cost), 0);
  const bn = I.problems.find((p) => p.id === "bottleneck");
  return (
    <div className="space-y-5">
      <div className="grid grid-cols-1 xl:grid-cols-3 gap-5 items-start">
        <div className="xl:col-span-2 space-y-5">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <Kpi label="Gain des 3 leviers internes" value={`${eur(I.internalGainEur)}/an`} note={`+${tons(I.internalGainT)} bonnes par an (SMED, maintenance, qualité)`} />
            <Kpi label="Plafond capacité goulot" value={`${eur(bn.gainEur)}/an`} alert note="Non additif : recoupe pannes et changements" />
            <Kpi label="Marge retenue" value={`${nf0.format(E.values.margin)} €/t`}
              note={A.confirmed("margin") ? "Valeur terrain" : "Hypothèse, à confirmer avec l'usine"} />
          </div>
          <p className="text-sm" style={{ color: C.muted }}>
            Problèmes classés du plus coûteux au moins coûteux sur la période. Tonnes perdues = tonnes bonnes non produites,
            au débit réel de l'extrusion ({nf2.format(I.rate)} t bonnes par heure de marche et par ligne). Annualisation × 365 / {I.days} jours.
            L'extrusion étant le goulot, chaque tonne qu'elle gagne est supposée vendue : à confirmer avec la direction commerciale.
          </p>
          {I.problems.map((pb, i) => <ProblemCard key={pb.id} rank={i + 1} pb={pb} E={E} M={M} maxCost={maxCost} />)}
        </div>
        <AssumptionsPanel A={A} />
      </div>

      <Card title="À collecter sur le terrain" sub={`Données à demander aux équipes de l'usine. ${A.pending} sur ${FIELD_CARDS.length} restent à confirmer ; tant qu'un encart est vide, la valeur par défaut est utilisée.`}>
        <div key={A.resetKey} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          {FIELD_CARDS.map((c) => <FieldCard key={c.key} card={c} A={A} />)}
        </div>
      </Card>
    </div>
  );
}

// ---------- Notes sur les données ----------
function DataNotes({ M }) {
  const c = M.clean;
  const notes = [];
  if (c.duplicates.length) notes.push(`${c.duplicates.length} lignes en double exact (${[...new Set(c.duplicates.map((r) => dLong(r.date) + ", équipe " + r.shift))].join(" ; ")}) : supprimées.`);
  if (c.kgRows.length) notes.push(`${c.kgRows.length} relevés saisis en kg au lieu de tonnes (${c.kgRows.map((r) => `${r.machine} ${dShort(r.date)} ${r.shift} : ${nf0.format(r.raw)}`).join(" ; ")}) : divisés par 1 000. Le total recoupe alors le tonnage d'extrusion du flux.`);
  if (M.missing.length) notes.push(`Équipe absente du journal : ${M.missing.map((m) => `${dLong(m.date)}, équipe ${m.shift}`).join(" ; ")}. Le flux journalier montre aussi un temps planifié réduit ce jour-là : traité comme un shift non planifié, pas une donnée perdue.`);
  if (c.zeroPlanned.length) notes.push(`${c.zeroPlanned.length} relevés à 0 min planifiée (${[...new Set(c.zeroPlanned.map((r) => r.machine + " le " + dLong(r.date)))].join(" ; ")}) : ligne non planifiée, sans effet sur les sommes ; ratios protégés contre la division par zéro.`);
  if (c.overStop.length) notes.push(`Arrêts déclarés supérieurs au temps planifié : ${c.overStop.map((r) => `${r.machine} ${dShort(r.date)} ${r.shift} (${r.stops} min pour ${r.planned})`).join(" ; ")}. run_min = 0 conservé tel quel.`);
  return (
    <Card title="Notes sur les données" sub="Anomalies détectées dans les fichiers sources et traitement appliqué (à confirmer avec le site)">
      <ul className="list-disc pl-5 space-y-1.5 text-sm">
        {notes.map((n, i) => <li key={i}>{n}</li>)}
        <li>Cadence nominale identique pour les 7 lignes (2,3 t/h) : la performance compare chaque ligne à cette même référence.</li>
      </ul>
    </Card>
  );
}

// ---------- Application ----------
const TABS = [["overview", "Vue d'ensemble"], ["lines", "Lignes"], ["flow", "Flow"], ["problems", "Problèmes & impact"]];

function App() {
  const [state, setState] = useState({ status: "loading" });
  const [tab, setTab] = useState("overview");
  const A = useAssumptions();
  const M0 = state.M;
  const E = useMemo(() => (M0 ? { values: A.values, impacts: K.impacts(M0.rows, M0.stageRows, A.lib) } : null),
    [M0, JSON.stringify(A.lib)]);
  useEffect(() => {
    Promise.all(["./extrusion_shift_log.csv", "./stage_daily.csv"].map((u) =>
      fetch(u).then((r) => { if (!r.ok) throw new Error(`${u} : HTTP ${r.status}`); return r.text(); })))
      .then(([a, b]) => setState({ status: "ok", M: buildModel(K.parseCSV(a), K.parseCSV(b)) }))
      .catch((e) => setState({ status: "error", error: e.message }));
  }, []);

  if (state.status === "loading") return <div className="p-12 text-center" style={{ color: C.muted }}>Chargement des données de production…</div>;
  if (state.status === "error") return (
    <div className="max-w-xl mx-auto mt-16 card p-6">
      <h1 className="text-lg font-semibold" style={{ color: C.accent }}>Impossible de charger les données</h1>
      <p className="mt-2 text-sm">{state.error}</p>
      <p className="mt-2 text-sm" style={{ color: C.muted }}>Les fichiers CSV doivent être servis à côté de index.html (ouvrir via un serveur, pas en file://).</p>
    </div>
  );
  const M = state.M;
  return (
    <div>
      <header style={{ background: C.navy }} className="text-white">
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 className="text-2xl sm:text-3xl font-semibold tracking-tight">Polymex — Cockpit usine</h1>
            <div className="text-sm opacity-80">Période : {dLong(M.dates[0])} – {dLong(M.dates[M.dates.length - 1])} · {M.dates.length} jours · 7 lignes d'extrusion · 3 équipes</div>
          </div>
          <nav className="flex flex-wrap items-center gap-1">
            {A.pending > 0 && (
              <button onClick={() => setTab("problems")} className="mr-2 text-xs font-semibold px-2 py-1 rounded"
                style={{ background: "#FDEBDD", color: "#9A4A06" }}>{A.pending} donnée{A.pending > 1 ? "s" : ""} à confirmer avec l'usine</button>
            )}
            {TABS.map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)} className="px-4 py-2 rounded-t text-base font-semibold"
                style={tab === k ? { background: "#F4F5F7", color: C.navy } : { color: "#fff", opacity: 0.85 }}>{l}</button>
            ))}
          </nav>
        </div>
      </header>
      <main className="max-w-[1400px] mx-auto px-4 sm:px-6 py-6">
        {tab === "overview" && <Overview M={M} E={E} go={setTab} />}
        {tab === "lines" && <Lines_ M={M} E={E} />}
        {tab === "flow" && <Flow M={M} E={E} />}
        {tab === "problems" && <Problems M={M} E={E} A={A} />}
      </main>
      <footer className="max-w-[1400px] mx-auto px-4 sm:px-6 pb-8 text-xs" style={{ color: C.muted }}>
        Indicateurs calculés dans le navigateur à partir de extrusion_shift_log.csv et stage_daily.csv. TRS = disponibilité × performance × qualité, agrégés par sommes.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
